[workspace]
members = [
    "crates/okv-consensus",
    "crates/okv-eval",
    "crates/okv-model",
    "crates/okv-object",
    "crates/okv-sim",
    "crates/okv-slate",
    "crates/okv-wal",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.44", features = ["derive"] }
# object_store 0.14.1 accepts crc-fast 1.10, whose MSRV is Rust 1.89.
# Pin the latest compatible release while this workspace targets Rust 1.88.
crc-fast = "=1.9.0"
futures-util = "0.3.31"
jsonschema = { version = "0.50.1", default-features = false }
okv-consensus = { path = "crates/okv-consensus" }
okv-model = { path = "crates/okv-model" }
okv-wal = { path = "crates/okv-wal" }
object_store = { version = "=0.14.1", features = ["aws", "gcp"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
opentelemetry = { version = "0.32.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["logs", "metrics", "trace"] }
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "e0161973d8d7ffdede7c44725729838811674e99", default-features = false }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
turmoil = { version = "=0.7.2", features = ["unstable-fs"] }
uuid = { version = "1.18.0", features = ["v4"] }
