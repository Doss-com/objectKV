<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">objectKV commit, point-read, and analytical paths</title>
  <desc id="desc">Three horizontal flows distinguish the foreground commit path, the latest point-read path, and the exact analytical snapshot path.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#757575"/></marker>
    <style>
      .lane{fill:#fafafa;stroke:#00000014;stroke-width:1}.box{fill:#fff;stroke:#00000017;stroke-width:1}.active{fill:#fff;stroke:#1a85ff;stroke-width:1.5}.future{fill:#fafafa;stroke:#c9c9c9;stroke-width:1;stroke-dasharray:7 5}.flow{fill:none;stroke:#757575;stroke-width:1.5;marker-end:url(#arrow)}.async{fill:none;stroke:#1a85ff;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#arrow)}.title{font:600 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.head{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.text{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4d4d4d}.small{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b6b6b}.status{font:600 10px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0061d5;letter-spacing:.4px}
    </style>
  </defs>
  <text class="title" x="48" y="38">The three data paths have different foreground work</text>

  <rect class="lane" x="48" y="68" width="1104" height="158" rx="4"/>
  <text class="head" x="70" y="94">Commit path</text><text class="status" x="1044" y="94">TARGET</text>
  <rect class="box" x="70" y="120" width="174" height="60" rx="4"/><text class="text" x="92" y="146">transaction</text><text class="small" x="92" y="165">read and write sets</text>
  <rect class="future" x="284" y="120" width="174" height="60" rx="4"/><text class="text" x="306" y="146">order + resolve</text><text class="small" x="306" y="165">assign version C</text>
  <rect class="active" x="498" y="120" width="174" height="60" rx="4"/><text class="text" x="520" y="146">stable txLog quorum</text><text class="small" x="520" y="165">persist mutation outcome</text>
  <rect class="active" x="712" y="120" width="174" height="60" rx="4"/><text class="text" x="734" y="146">COMMITTED</text><text class="small" x="734" y="165">reply after quorum</text>
  <rect class="active" x="926" y="120" width="204" height="60" rx="4"/><text class="text" x="948" y="146">publish closure</text><text class="small" x="948" y="165">advance O, then safe pop</text>
  <path class="flow" d="M244 150H284"/><path class="flow" d="M458 150H498"/><path class="flow" d="M672 150H712"/><path class="async" d="M886 150H926"/>
  <text class="small" x="894" y="139">async</text>

  <rect class="lane" x="48" y="246" width="1104" height="158" rx="4"/>
  <text class="head" x="70" y="272">Latest point read</text><text class="status" x="1008" y="272">SINGLE RANGE VERIFIED</text>
  <rect class="box" x="70" y="298" width="174" height="60" rx="4"/><text class="text" x="92" y="324">snapshot T</text><text class="small" x="92" y="343">current cell version</text>
  <rect class="active" x="284" y="298" width="174" height="60" rx="4"/><text class="text" x="306" y="324">mutable overlay</text><text class="small" x="306" y="343">newest version first</text>
  <rect class="active" x="498" y="298" width="174" height="60" rx="4"/><text class="text" x="520" y="324">coverage map</text><text class="small" x="520" y="343">safe hit or miss</text>
  <rect class="active" x="712" y="298" width="174" height="60" rx="4"/><text class="text" x="734" y="324">resident image</text><text class="small" x="734" y="343">RAM, NVMe, or RocksDB</text>
  <rect class="box" x="926" y="298" width="204" height="60" rx="4"/><text class="text" x="948" y="324">indexed object miss</text><text class="small" x="948" y="343">bounded range GET</text>
  <path class="flow" d="M244 328H284"/><path class="flow" d="M458 328H498"/><path class="flow" d="M672 328H712"/><path class="flow" d="M886 328H926"/>

  <rect class="lane" x="48" y="424" width="1104" height="178" rx="4"/>
  <text class="head" x="70" y="450">Exact analytical snapshot</text><text class="status" x="1014" y="450">EVALUATING</text>
  <rect class="box" x="70" y="482" width="174" height="72" rx="4"/><text class="text" x="92" y="509">one query version T</text><text class="small" x="92" y="530">shared by every table</text>
  <rect class="active" x="284" y="470" width="220" height="54" rx="4"/><text class="text" x="306" y="496">columnar base at W</text><text class="small" x="306" y="514">Parquet or Vortex view</text>
  <rect class="active" x="284" y="538" width="220" height="42" rx="4"/><text class="text" x="306" y="564">row changes in (W, T]</text>
  <rect class="future" x="558" y="482" width="220" height="72" rx="4"/><text class="text" x="580" y="509">latest change per key</text><text class="small" x="580" y="530">retain invalidation keys</text>
  <rect class="future" x="832" y="482" width="298" height="72" rx="4"/><text class="text" x="854" y="509">streaming primary-key overlay</text><text class="small" x="854" y="530">exact Arrow batches into DataFusion</text>
  <path class="flow" d="M244 518H270V497H284"/><path class="flow" d="M244 518H270V559H284"/>
  <path class="flow" d="M504 497H532V510H558"/><path class="flow" d="M504 559H532V526H558"/><path class="flow" d="M778 518H832"/>
  <text class="small" x="70" y="584">W controls tail cost, not freshness. Tail keys suppress stale base rows even when the replacement row fails the final predicate.</text>
</svg>
