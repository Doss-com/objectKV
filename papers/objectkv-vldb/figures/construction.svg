<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">objectKV architecture from object storage to application fabric</title>
  <desc id="desc">A bottom-up diagram showing immutable objects, publication and transaction logs, disposable RangeEngine serving compute, the cell transaction plane, and typed application surfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#757575"/>
    </marker>
    <style>
      .layer{fill:#fafafa;stroke:#00000014;stroke-width:1}.node{fill:#ffffff;stroke:#00000017;stroke-width:1}.active{fill:#ffffff;stroke:#1a85ff;stroke-width:1.5}.future{fill:#fafafa;stroke:#c9c9c9;stroke-width:1;stroke-dasharray:7 5}.flow{fill:none;stroke:#757575;stroke-width:1.5;marker-end:url(#arrow)}.soft{fill:none;stroke:#c9c9c9;stroke-width:1.5;marker-end:url(#arrow)}.title{font:600 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717;letter-spacing:-.3px}.head{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.text{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4d4d4d}.small{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b6b6b}.status{font:600 10px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0061d5;letter-spacing:.4px}.mono{font:400 12px ui-monospace,"SF Mono",Menlo,monospace;fill:#4d4d4d}
    </style>
  </defs>

  <text class="title" x="48" y="38">objectKV, one history with several physical views</text>

  <rect class="layer" x="48" y="62" width="1104" height="112" rx="4"/>
  <text class="head" x="70" y="88">Application fabric</text>
  <text class="status" x="1030" y="88">PROPOSED</text>
  <rect class="node" x="70" y="106" width="194" height="46" rx="4"/><text class="text" x="92" y="134">PostgreSQL pages</text>
  <rect class="node" x="282" y="106" width="194" height="46" rx="4"/><text class="text" x="304" y="134">Redis-style objects</text>
  <rect class="node" x="494" y="106" width="194" height="46" rx="4"/><text class="text" x="516" y="134">ordered logs</text>
  <rect class="node" x="706" y="106" width="194" height="46" rx="4"/><text class="text" x="728" y="134">search and VFS</text>
  <rect class="node" x="918" y="106" width="212" height="46" rx="4"/><text class="text" x="940" y="134">DataFusion snapshots</text>

  <rect class="active" x="48" y="202" width="1104" height="82" rx="4"/>
  <text class="head" x="70" y="232">okv-fabric</text>
  <text class="text" x="70" y="258">read · upsert · atomic modify · delete · ordered scan · transaction envelope · snapshot version</text>
  <text class="status" x="1002" y="232">ACTIVE WORK</text>

  <rect class="future" x="48" y="312" width="1104" height="112" rx="4"/>
  <text class="head" x="70" y="338">One bounded transaction cell</text>
  <text class="status" x="1030" y="338">PROPOSED</text>
  <rect class="node" x="70" y="356" width="240" height="46" rx="4"/><text class="text" x="92" y="384">read-version service</text>
  <rect class="node" x="330" y="356" width="240" height="46" rx="4"/><text class="text" x="352" y="384">commit proxy</text>
  <rect class="node" x="590" y="356" width="240" height="46" rx="4"/><text class="text" x="612" y="384">resolver partitions</text>
  <rect class="node" x="850" y="356" width="280" height="46" rx="4"/><text class="text" x="872" y="384">range map and assignments</text>

  <rect class="active" x="48" y="452" width="514" height="116" rx="4"/>
  <text class="head" x="70" y="480">RangeEngine, disposable serving compute</text>
  <text class="text" x="70" y="508">one MVCC overlay and coverage map</text>
  <text class="text" x="70" y="532">RAM image · native NVMe cache · RocksDB image</text>
  <text class="status" x="438" y="480">EVALUATING</text>

  <rect class="active" x="588" y="452" width="268" height="116" rx="4"/>
  <text class="head" x="610" y="480">stable txLog</text>
  <text class="text" x="610" y="508">ordered suffix (O, C]</text>
  <text class="text" x="610" y="532">quorum commit depth</text>
  <text class="status" x="744" y="480">L1 VERIFIED</text>

  <rect class="active" x="882" y="452" width="270" height="116" rx="4"/>
  <text class="head" x="904" y="480">materializer</text>
  <text class="text" x="904" y="508">build · authenticate · publish</text>
  <text class="text" x="904" y="532">advance object frontier O</text>
  <text class="status" x="1032" y="480">EVALUATING</text>

  <rect class="active" x="48" y="598" width="1104" height="116" rx="4"/>
  <text class="head" x="70" y="626">Immutable object closure, permanent reconstructable state</text>
  <text class="mono" x="70" y="654">Database(C) = ObjectState(O) + stableTxLog(O, C]</text>
  <text class="text" x="70" y="682">C0 indexed rows · C5v2 aligned columnar projection and opaque payload · branch roots · snapshots</text>
  <text class="status" x="986" y="626">GCS VERIFIED SCOPE</text>

  <path class="flow" d="M600 202V174"/>
  <path class="soft" d="M600 312V284"/>
  <path class="flow" d="M450 452V424"/>
  <path class="flow" d="M722 452V424"/>
  <path class="soft" d="M1017 452V424"/>
  <path class="flow" d="M305 598V568"/>
  <path class="flow" d="M722 568V598"/>
  <path class="flow" d="M1017 568V598"/>
  <text class="small" x="574" y="192">typed views</text>
  <text class="small" x="673" y="590">retained recovery suffix</text>
</svg>
