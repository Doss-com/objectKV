<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">objectKV evidence ladder</title>
  <desc id="desc">The evidence ladder separates finite formal models, local mechanism tests, single-cloud-machine GCS and NVMe evidence, independent-machine quorum tests, and sustained multi-zone curves.</desc>
  <defs>
    <style>
      .done{fill:#fff;stroke:#1a85ff;stroke-width:1.5}.open{fill:#fafafa;stroke:#c9c9c9;stroke-width:1;stroke-dasharray:7 5}.axis{stroke:#757575;stroke-width:1.5}.title{font:600 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.head{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.text{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4d4d4d}.small{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b6b6b}.status{font:600 10px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0061d5;letter-spacing:.4px}.num{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}
    </style>
  </defs>
  <text class="title" x="48" y="38">Evidence becomes stronger as failure domains separate</text>
  <line class="axis" x1="72" y1="446" x2="1128" y2="446"/>
  <g transform="translate(48,84)"><rect class="done" width="190" height="326" rx="4"/><text class="num" x="20" y="34">1</text><text class="head" x="20" y="68">Finite formal model</text><text class="text" x="20" y="100">TLA+ transitions</text><text class="text" x="20" y="122">two healthy scopes</text><text class="text" x="20" y="144">six named poisons</text><text class="status" x="20" y="288">VERIFIED</text><text class="small" x="20" y="310">safety only</text></g>
  <g transform="translate(258,126)"><rect class="done" width="190" height="284" rx="4"/><text class="num" x="20" y="34">2</text><text class="head" x="20" y="68">Local mechanisms</text><text class="text" x="20" y="100">files + MinIO</text><text class="text" x="20" y="122">TCP processes</text><text class="text" x="20" y="144">kill + restart</text><text class="status" x="20" y="246">VERIFIED</text><text class="small" x="20" y="268">one host</text></g>
  <g transform="translate(468,168)"><rect class="done" width="220" height="242" rx="4"/><text class="num" x="20" y="34">3</text><text class="head" x="20" y="68">GCP NVMe + GCS</text><text class="text" x="20" y="100">matched hot reads</text><text class="text" x="20" y="122">object geometry</text><text class="text" x="20" y="144">closure recovery</text><text class="status" x="20" y="204">VERIFIED SCOPE</text><text class="small" x="20" y="226">single machine, real services</text></g>
  <g transform="translate(708,230)"><rect class="done" width="210" height="180" rx="4"/><text class="num" x="20" y="34">4</text><text class="head" x="20" y="68">Independent machines</text><text class="text" x="20" y="100">three stable media</text><text class="text" x="20" y="122">closed-loop quorum</text><text class="status" x="20" y="150">PREFLIGHT VERIFIED</text><text class="small" x="20" y="169">matched curve open</text></g>
  <g transform="translate(938,292)"><rect class="open" width="214" height="118" rx="4"/><text class="num" x="20" y="34">5</text><text class="head" x="20" y="64">Sustained multi-zone</text><text class="text" x="20" y="88">failure + cost curves</text><text class="status" x="20" y="108">PROPOSED</text></g>
  <text class="small" x="48" y="480">Model confidence</text><text class="small" x="1030" y="480">Operational confidence</text>
  <text class="small" x="48" y="504">Every verified claim remains limited to its named scope, source, topology, workload, and control.</text>
</svg>
