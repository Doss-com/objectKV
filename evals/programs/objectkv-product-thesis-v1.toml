[[phases]]
id = "P0"
name = "Freeze semantic contracts"
objective = "Reject impossible versions, mutations, retries, and commit envelopes before physical optimization."
depends_on = []

[[phases.gates]]
id = "G0.1"
status = "verified"
kind = "correctness"
claim = "The ordered MVCC model returns exact snapshots and rejects poisoned history semantics."
falsifier = "Any poison subject keeps or any correct history diverges from the normalized oracle."
requirement_ids = ["MVCC-001", "MVCC-002", "MVCC-003", "MVCC-004", "MVCC-005", "EVAL-006"]
suite = "../suites/model-history.toml"
profile = "generated-dev"
workload = "generated-mvcc-history"
backend = "model"
lane = "mvcc-semantics"
negative_controls = [
  "generated-mvcc-history-ignore-range-clears",
  "generated-mvcc-history-mutation-order-affects-replay",
  "generated-mvcc-history-accept-conflicting-replay",
  "generated-mvcc-history-future-read-fallback",
  "generated-mvcc-history-reject-retention-boundary",
  "generated-mvcc-history-serve-expired-read",
  "generated-mvcc-history-accept-stale-generation",
]
evidence = ["experiments/ledger.jsonl: mvcc-semantics-v1 contract admission"]

[[phases.gates]]
id = "G0.2"
status = "verified"
kind = "correctness"
claim = "A replayable commit envelope preserves request identity, complete conflict acceptance, required log tags, generation fencing, and quorum acknowledgement."
falsifier = "A partial, stale, non-durable, or conflicting commit envelope is admitted."
requirement_ids = ["TXN-001", "TXN-003", "TXN-004", "LOG-001", "EVAL-006"]
suite = "../suites/commit-contract.toml"
profile = "sim-dev"
workload = "cell-commit-envelope"
backend = "sim-model"
lane = "commit-contract"
negative_controls = [
  "cell-commit-ram-only-dedup",
  "cell-commit-accept-conflicting-retry",
  "cell-commit-accept-partial-resolver",
  "cell-commit-omit-required-log-tag",
  "cell-commit-accept-stale-generation",
  "cell-commit-ack-before-quorum",
]
evidence = ["experiments/ledger.jsonl: cell-commit-contract-v1 contract admission"]

[[phases.gates]]
id = "G0.3"
status = "evaluating"
kind = "correctness"
claim = "An independent oracle accepts exact Cell v0 OCC histories and rejects point conflicts, range phantoms, partial commits, incomplete conflict coverage, and stale read versions."
falsifier = "The correct single-authority subject produces an anomaly, any poison survives, or the checker depends on resolver implementation logic."
requirement_ids = ["TXN-002", "TXN-005", "PRD-006", "EVAL-006"]
suite = "../suites/serializability.toml"
profile = "model-dev"
workload = "strict-serializable-four-range-history"
backend = "cell-v0-resolver-model"
lane = "strict-serializability"
negative_controls = [
  "strict-serializability-accept-point-conflict",
  "strict-serializability-accept-range-phantom",
  "strict-serializability-partial-commit",
  "strict-serializability-omit-read-conflict",
  "strict-serializability-omit-write-conflict",
  "strict-serializability-stale-read-version",
]
evidence = []

[[phases.gates]]
id = "G0.4"
status = "evaluating"
kind = "correctness"
claim = "One OpenRaft data group applies strict-serializable multi-range transactions, retains exact retry outcomes through leader-process death, and reconstructs equal transaction state after killed-node restart."
falsifier = "The independent history oracle observes an invalid read, conflict, or atomic effect; a lost reply loses or duplicates an outcome; a restarted replica diverges; or either poison subject survives."
requirement_ids = ["TXN-002", "TXN-003", "TXN-005", "LOG-001", "LOG-002", "PRD-006", "EVAL-006"]
suite = "../suites/serializability-process.toml"
profile = "local-fs"
