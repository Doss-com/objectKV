backend = "process-openraft+transaction-authority"
lane = "replicated-strict-serializability"
negative_controls = [
  "openraft-transaction-accept-conflicts",
  "openraft-transaction-partial-apply",
]
evidence = [
  "docs/research/strict-serializability-g0.4-process.md",
  "experiments/ledger.jsonl: replicated-strict-serializability diagnostic",
]

[[phases]]
id = "P1"
name = "Prove the fast durable tail"
objective = "Prove quorum acknowledgement, exact retry, failover, and bounded recovery debt without object storage in the normal commit path."
depends_on = ["P0"]

[[phases.gates]]
id = "G1.1"
status = "verified"
kind = "correctness"
claim = "A quorum-committed request survives a lost reply, real leader-process death, successor retry, and killed-node restart with one logical effect."
falsifier = "An acknowledged effect disappears, applies twice, or cannot be recovered from committed history."
requirement_ids = ["TXN-003", "LOG-001", "LOG-002", "LOG-003", "LOG-007"]
suite = "../suites/raft-process.toml"
profile = "local-fs"
workload = "openraft-process-lost-reply"
backend = "process-local-fs"
lane = "commit-failover"
negative_controls = [
  "openraft-process-disable-dedup",
  "openraft-process-ack-before-quorum",
  "openraft-process-skip-killed-restart",
]
evidence = ["experiments/ledger.jsonl: openraft-process-contract-v1 contract admission"]

[[phases.gates]]
id = "G1.2"
status = "proposed"
kind = "operational"
claim = "Object-store brownouts retain a bounded txLog suffix through explicit warning, rate-limit, and refusal thresholds."
falsifier = "Retained txLog bytes grow without bound at admitted ingest or acknowledgement semantics weaken during a brownout."
requirement_ids = ["TXN-010", "LOG-004", "LOG-008", "LOG-009", "PUB-010"]
suite = "../suites/product-thesis.toml"
profile = "ssd-resident-dev"
workload = "objectification-brownout"
