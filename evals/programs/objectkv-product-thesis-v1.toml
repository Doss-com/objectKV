[[phases]]
id = "P2"
name = "Prove object authority"
objective = "Recover immutable object and manifest publication across ambiguous effects, process death, authority failover, and garbage-collection races."
depends_on = ["P1"]

[[phases.gates]]
id = "G2.1"
status = "verified"
kind = "correctness"
claim = "A lost successful publication reply recovers the original outcome without a second authority or object effect."
falsifier = "Final-state convergence hides duplicate publication, missing closure verification, or an unrecoverable successful outcome."
requirement_ids = ["OBJ-005", "OBJ-006", "OBJ-008", "PUB-001", "PUB-002", "PUB-003", "PUB-004"]
