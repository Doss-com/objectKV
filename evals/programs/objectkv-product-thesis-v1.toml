lane = "publisher-publish-recovery"
negative_controls = ["publisher-publish-unknown-convergence-only"]
evidence = ["experiments/ledger.jsonl: object-publication-publisher-publish-recovery-v1 contract admission"]

[[phases.gates]]
id = "G2.2"
status = "verified"
kind = "correctness"
claim = "Publication and garbage collection preserve every reachable object across pointer, intent, mark, reservation, LIST, and epoch interleavings."
falsifier = "Any root, snapshot, or in-flight publication can reference an object reclaimed by the collector."
