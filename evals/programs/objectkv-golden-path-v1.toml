backend = "model"
lane = "mvcc-semantics"
checkpoint = "semantic-history"
negative_controls = [
  "generated-mvcc-history-ignore-range-clears",
  "generated-mvcc-history-accept-conflicting-replay",
  "generated-mvcc-history-accept-stale-generation",
]
evidence = []

[[phases]]
id = "GP1"
name = "Recover the acknowledged frontier"
objective = "Drive the same history through the durable tail and recover exact request outcomes after process and reply failures."
depends_on = ["GP0"]

[[phases.gates]]
id = "GP1.1"
status = "proposed"
kind = "correctness"
claim = "Every acknowledged golden-path mutation and request outcome survives the declared quorum failures exactly once."
falsifier = "An acknowledged effect disappears, applies twice, or recovers a different request outcome."
requirement_ids = ["TXN-003", "TXN-004", "LOG-001", "LOG-002", "LOG-003", "LOG-007", "LOG-010"]
suite = "../suites/raft-process.toml"
profile = "local-fs"
workload = "openraft-process-lost-reply"
backend = "process-local-fs"
lane = "commit-failover"
checkpoint = "durable-tail"
negative_controls = [
  "openraft-process-disable-dedup",
  "openraft-process-ack-before-quorum",
  "openraft-process-skip-killed-restart",
]
evidence = []

[[phases]]
id = "GP2"
name = "Publish the object base"
objective = "Pack a committed prefix into immutable objects and publish one complete fenced closure."
depends_on = ["GP1"]

[[phases.gates]]
id = "GP2.1"
status = "proposed"
kind = "correctness"
claim = "The golden-path manifest root names one complete closure that reconstructs the declared object watermark across ambiguous effects."
falsifier = "A root becomes visible before its closure is complete, or recovery hides a duplicate or missing publication effect."
requirement_ids = ["OBJ-001", "OBJ-004", "OBJ-005", "OBJ-006", "OBJ-008", "PUB-001", "PUB-002", "PUB-003", "PUB-004"]
suite = "../suites/object-publication-publisher-publish-recovery.toml"
profile = "local-fs"
workload = "publisher-publish-unknown-restart"
backend = "object-store-local-fs+process-openraft"
lane = "publisher-publish-recovery"
checkpoint = "object-base"
negative_controls = ["publisher-publish-unknown-convergence-only"]
evidence = []

[[phases]]
id = "GP2.5"
name = "Prove transaction-plane controls"
objective = "Use FoundationDB as the strict-serializability and lifecycle control while the objectKV-native RocksDB and OpenRaft plane earns admission one bounded gate at a time."
depends_on = ["GP2"]

[[phases.gates]]
id = "GP2.5.1"
status = "verified"
kind = "correctness"
claim = "The source-pinned preflight fails closed on snapshot isolation and on a provider whose label claims stronger semantics than its executed history."
falsifier = "TiKV or the false-serializable poison advances to a live spike, or the FoundationDB mapping cannot name every P1 through P10 mechanism."
requirement_ids = ["MVCC-001", "MVCC-002", "TXN-001", "TXN-003", "TXN-004", "OBJ-006", "EVAL-011", "EVAL-012"]
suite = "../suites/resident-plane-selection-preflight.toml"
profile = "source-pinned-model"
workload = "foundationdb-7.4.6-contract-preflight"
backend = "foundationdb-7.4.6+explicit-versionstamped-retained-keys"
lane = "resident-plane-semantic-fit"
checkpoint = "resident-plane"
negative_controls = [
  "tikv-8.5.7-snapshot-isolation-negative",
  "tikv-false-serializable-label-negative",
]
evidence = [
  "../../docs/research/incumbent-transaction-plane-selection-2026-08-27.md",
  "../../docs/artifacts/eval-receipts/incumbent-plane-r0-2026-08-27/README.md",
]

[[phases.gates]]
id = "GP2.5.2"
status = "verified"
