lane = "resident-plane-lifecycle"
checkpoint = "resident-plane"
negative_controls = [
  "foundationdb-omit-retained-change-poison",
  "foundationdb-accept-unknown-without-outcome-poison",
  "foundationdb-restore-without-generation-poison",
]
evidence = ["../../docs/artifacts/eval-receipts/incumbent-plane-r0-2026-08-27/README.md"]

