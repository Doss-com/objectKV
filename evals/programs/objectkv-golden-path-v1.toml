[[phases]]
id = "GP0"
name = "Freeze one logical history"
objective = "Generate one deterministic commerce-ledger history and independent exact-snapshot oracle for every later surface."
depends_on = []

[[phases.gates]]
id = "GP0.1"
status = "proposed"
kind = "correctness"
claim = "The golden-path history produces exact versions, conflicts, retries, range clears, and snapshot reads."
falsifier = "Any correct replay diverges from the normalized oracle or any poisoned history is accepted."
requirement_ids = ["MVCC-001", "MVCC-002", "MVCC-003", "MVCC-004", "TXN-001", "EVAL-011", "EVAL-012"]
suite = "../suites/model-history.toml"
profile = "generated-dev"
