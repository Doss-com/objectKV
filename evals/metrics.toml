schema_version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.profile.hash",
  "okv.eval.candidate.commit",
  "okv.eval.backend",
]

[[metrics]]
id = "correctness.failures"
otel_name = "okv.eval.correctness.failures"
kind = "counter"
unit = "{failure}"
description = "Correctness assertions that failed during one evaluation run"
attributes = ["lane", "workload", "failure.class"]
required_attributes = ["lane", "workload"]

[[metrics]]
id = "operation.duration"
otel_name = "okv.eval.operation.duration"
kind = "histogram"
unit = "s"
description = "End-to-end latency of a logical evaluation operation"
attributes = ["lane", "workload", "operation", "backend", "cache.state", "result"]
required_attributes = ["lane", "workload", "operation", "backend", "result"]
boundaries = [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]

[[metrics]]
id = "operation.throughput"
otel_name = "okv.eval.operation.throughput"
kind = "gauge"
unit = "{operation}/s"
description = "Completed logical operations per second"
attributes = ["lane", "workload", "operation", "backend"]
required_attributes = ["lane", "workload", "operation", "backend"]

[[metrics]]
id = "range_serving.view_open_duration"
otel_name = "okv.eval.range_serving.view_open_duration"
kind = "histogram"
unit = "s"
description = "Time to identity-check the authority base, open its immutable reader, authenticate the certified txLog suffix, and build the overlay"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
boundaries = [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]

[[metrics]]
id = "range_serving.tail_auth_duration"
otel_name = "okv.eval.range_serving.tail_auth_duration"
kind = "histogram"
unit = "s"
description = "Time to decode, authenticate, and index the certified txLog suffix"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
boundaries = [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]

[[metrics]]
id = "range_serving.publication_swap_duration"
otel_name = "okv.eval.range_serving.publication_swap_duration"
kind = "histogram"
unit = "s"
description = "Time holding the process-local compare-and-swap boundary to publish one fully authenticated immutable Range Engine view"
attributes = ["lane", "workload", "backend", "result"]
required_attributes = ["lane", "workload", "backend", "result"]
boundaries = [0.000001, 0.0000025, 0.000005, 0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01]

[[metrics]]
id = "range_read.point_duration"
otel_name = "okv.eval.range_read.point_duration"
kind = "histogram"
unit = "s"
description = "End-to-end exact point-read latency over the KV Runtime routed-read transport"
attributes = ["lane", "workload", "backend", "transport", "cache.state"]
required_attributes = ["lane", "workload", "backend", "transport", "cache.state"]
boundaries = [0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1]

[[metrics]]
id = "range_read.scan_duration"
otel_name = "okv.eval.range_read.scan_duration"
kind = "histogram"
unit = "s"
description = "End-to-end exact single-range scan latency over the KV Runtime routed-read transport"
attributes = ["lane", "workload", "backend", "transport", "cache.state"]
required_attributes = ["lane", "workload", "backend", "transport", "cache.state"]
boundaries = [0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1]

[[metrics]]
id = "postgres.page_point_duration"
otel_name = "okv.eval.postgres.page_point_duration"
kind = "histogram"
unit = "s"
description = "End-to-end authenticated 8 KiB PostgreSQL page point-read latency through the routed KV Runtime"
attributes = ["lane", "workload", "backend", "transport", "cache.state"]
required_attributes = ["lane", "workload", "backend", "transport", "cache.state"]
boundaries = [0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1]

[[metrics]]
id = "postgres.page_vector_duration"
otel_name = "okv.eval.postgres.page_vector_duration"
kind = "histogram"
unit = "s"
description = "End-to-end consecutive PostgreSQL page-read latency across routed KV Runtime ranges"
attributes = ["lane", "workload", "backend", "transport", "cache.state"]
required_attributes = ["lane", "workload", "backend", "transport", "cache.state"]
boundaries = [0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1]

[[metrics]]
id = "range_serving.first_point_duration"
otel_name = "okv.eval.range_serving.first_point_duration"
kind = "histogram"
unit = "s"
description = "First exact point read through a process-cold but OS-warm authority-bound local view"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
boundaries = [0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25]

[[metrics]]
id = "range_serving.warm_point_p99"
otel_name = "okv.eval.range_serving.warm_point_p99"
kind = "histogram"
unit = "s"
description = "Within-view p99 exact point-read latency after the first read"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
boundaries = [0.000005, 0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05]

[[metrics]]
id = "range_serving.scan_throughput"
otel_name = "okv.eval.range_serving.scan_throughput"
kind = "gauge"
unit = "{row}/s"
description = "Exact ordered base-plus-tail rows emitted per second"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]

[[metrics]]
id = "range_serving.object_requests_per_read"
otel_name = "okv.eval.range_serving.object_requests_per_read"
kind = "gauge"
unit = "{request}/{read}"
description = "Observed local object-store API requests per measured point read"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]

[[metrics]]
id = "range_serving.peak_rss_bytes"
otel_name = "okv.eval.range_serving.peak_rss_bytes"
kind = "gauge"
unit = "By"
description = "Peak resident bytes reported by the isolated Range Engine curve worker"
attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]
required_attributes = ["lane", "workload", "backend", "base.keys", "tail.records", "cache.mode", "phase"]

