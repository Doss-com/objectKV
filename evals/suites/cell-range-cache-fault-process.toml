schema_version = 1
id = "cell-range-cache-fault-process-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0007-manifest-publication.md",
  "../../rfcs/0059-kv-runtime-snapshot-floor-and-history-gc.md",
  "../../rfcs/0061-range-serving-performance-curve.md",
]
dataset_generator = "deterministic-persistent-cache-fault-process-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 262144
key_count = 1
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 24
repeats = 1
backend = "local-process+authority-bound-slatedb+persistent-cache-faults"
worker_processes_per_seed = 4
cache_part_bytes = 65536
cache_capacity_bytes = 16777216

[[lanes]]
id = "range-cache-fault"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "range-cache-fault-correct"
lane = "range-cache-fault"
operation = "range_cache_fault_process_contract"

[[workloads]]
id = "range-cache-fault-skip-overwrite"
lane = "range-cache-fault"
operation = "range_cache_fault_process_contract"
negative_control = "skip_overwrite_injection"

[[workloads]]
id = "range-cache-fault-skip-torn-write"
lane = "range-cache-fault"
operation = "range_cache_fault_process_contract"
negative_control = "skip_torn_write_injection"

[[workloads]]
id = "range-cache-fault-accept-wrong-overwrite"
lane = "range-cache-fault"
operation = "range_cache_fault_process_contract"
negative_control = "accept_wrong_value_after_overwrite"

[[workloads]]
id = "range-cache-fault-accept-wrong-torn-write"
lane = "range-cache-fault"
operation = "range_cache_fault_process_contract"
negative_control = "accept_wrong_value_after_torn_write"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
worker_processes_per_seed = 4
overwrite_fault_injected = true
torn_write_fault_injected = true
wrong_values = 0
exact_repair_or_refusal = true
exact_process_replay = true
negative_controls_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
schema_version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.workload.id",
  "okv.eval.backend",
  "okv.eval.candidate.commit",
  "okv.eval.parent.commit",
]
