schema_version = 1
id = "postgres-page-write-gate-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0063-postgres-wal-before-page-write.md",
  "../../docs/research/postgres-18-6-storage-bridge.md",
]
dataset_generator = "postgres-page-write-admission-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 49152
key_count = 6
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "operations"
budget_limit = 15
repeats = 1
backend = "local-process+postgres-page-write-admission"
page_size_bytes = 8192
pages_per_batch = 2
expected_objectkv_version = 41
maximum_page_lsn = 900
postgres_wal_flush_lsn = 900

[[lanes]]
id = "postgres-page-write-admission"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "postgres-page-write-correct"
lane = "postgres-page-write-admission"
operation = "postgres_page_write_gate_contract"

[[workloads]]
id = "postgres-page-write-wal-behind"
lane = "postgres-page-write-admission"
operation = "postgres_page_write_gate_contract"
negative_control = "wal_behind_page"

[[workloads]]
id = "postgres-page-write-zero-objectkv-version"
lane = "postgres-page-write-admission"
operation = "postgres_page_write_gate_contract"
negative_control = "zero_objectkv_version"

[[workloads]]
id = "postgres-page-write-oversized-batch"
lane = "postgres-page-write-admission"
operation = "postgres_page_write_gate_contract"
negative_control = "oversized_batch"

[[workloads]]
id = "postgres-page-write-wrong-digest"
lane = "postgres-page-write-admission"
operation = "postgres_page_write_gate_contract"
negative_control = "accept_wrong_digest"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
page_size_bytes = 8192
pages_per_batch = 2
objectkv_version_must_be_nonzero = true
wal_before_page = true
batch_bound_must_hold = true
mutation_digest_must_hold = true
exact_canonical_replay = true
negative_controls_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true

[telemetry.schema]
version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "page.lsn",
  "wal.flush.lsn",
  "request.id",
  "mutation.sha256",
  "trace.id",
  "span.id",
]
