schema_version = 1
id = "commit-proxy-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0032-transaction-batch-entry.md",
  "../../rfcs/0033-commit-proxy-batch-closure.md",
  "../../rfcs/0034-compact-transaction-wire.md",
]
dataset_generator = "independent-unique-key-commit-proxy-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 131072
key_count = 1024
seeds = [5001, 5002, 5003]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
backend = "data-openraft-local-process+stable-journal"
authority_nodes = 3
transaction_count = 1024
value_bytes = 128
candidate_concurrent_clients = 64
admission_knee_clients = 32
max_batch_items = 16
max_entry_bytes = 262144
max_batch_delay_micros = 2000
queue_capacity = 2048
sparse_transaction_count = 32
byte_control_transaction_count = 128
byte_control_value_bytes = 8192
byte_control_max_entry_bytes = 131072
overload_transaction_count = 512
overload_queue_capacity = 16
candidate_min_transactions_per_second = 500
candidate_min_logical_transactions_per_append = 8
candidate_max_commit_p99_seconds = 0.1
candidate_transactions_per_batch = 16
control_max_in_flight = 64
build_profile = "release"
durability_profile = "openraft-node-journal-sync-all"

[[lanes]]
id = "commit-proxy"
primary_metric = "commit.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "commit-proxy-saturated-candidate"
lane = "commit-proxy"
operation = "commit_proxy_contract"
subject = "saturated_candidate"
window_class = "64-callers"

[[workloads]]
id = "commit-proxy-admission-knee-control"
lane = "commit-proxy"
operation = "commit_proxy_contract"
subject = "admission_knee_control"
window_class = "32-callers"

[[workloads]]
id = "commit-proxy-sparse-arrival-control"
lane = "commit-proxy"
operation = "commit_proxy_contract"
subject = "sparse_arrival_control"
window_class = "delay-close"

[[workloads]]
id = "commit-proxy-byte-bound-control"
lane = "commit-proxy"
operation = "commit_proxy_contract"
subject = "byte_bound_control"
window_class = "byte-close"

[[workloads]]
id = "commit-proxy-overload-control"
lane = "commit-proxy"
operation = "commit_proxy_contract"
subject = "overload_control"
window_class = "bounded-overload"

[[workloads]]
id = "commit-proxy-oversized-item-poison"
lane = "commit-proxy"
operation = "commit_proxy_contract"
negative_control = "oversized_item_poison"
window_class = "pre-admission-poison"

[[workloads]]
id = "one-entry-same-durability-control"
lane = "commit-proxy"
operation = "transaction_batch_contract"
subject = "single_entry_control"
window_class = "64-one-entry-callers"

[hard_gates]
correctness_anomalies = 0
authority_processes = 3
release_build = true
candidate_min_transactions_per_second = 500
candidate_min_logical_transactions_per_append = 8
candidate_max_commit_p99_seconds = 0.1
admission_knee_max_commit_p99_seconds = 0.1
entry_byte_bound = true
sparse_delay_closure = true
byte_bound_min_batch_items = 4
explicit_overload_backpressure = true
oversized_item_rejected_before_mutation = true
fresh_controller_semantic_replay_is_exact = true
paired_min_throughput_improvement = 2.5
schema_valid = true
budget_must_hold = true
