schema_version = 1
id = "independent-media-frontier-convergence-v1"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0030-authenticated-object-frontier.md",
  "../../rfcs/0035-concurrent-commit-object-frontier.md",
  "../../rfcs/0036-independent-media-frontier-convergence.md",
  "../schema/transaction-machine-config-v1.schema.json",
]
dataset_generator = "repeated-frontier-conflict-history-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["gcp-three-zone-gcs"]

[dataset.gcp-three-zone-gcs]
logical_bytes = 4718592
key_count = 18688
seeds = [6101, 6102, 6103]

[profiles.gcp-three-zone-gcs]
budget_kind = "seconds"
budget_limit = 900
repeats = 1
backend = "gcp-three-zone-pd-ssd+gcs+openraft"
machine_config_env = "OKV_FRONTIER_MACHINE_CONFIG"
object_backend_config_env = "OKV_GCS_BACKEND_CONFIG"
artifact_dir_env = "OKV_EVAL_ARTIFACT_DIR"
data_authority_processes = 3
publication_authority_processes = 3
controller_processes = 1
failure_domains = 3
stable_media = "pd-ssd"
object_backend = "gcs-single-region"
prefix_transaction_count = 2048
frontier_cycles = 8
suffix_transaction_count_per_cycle = 2048
value_bytes = 256
concurrent_clients = 64
max_batch_items = 32
max_entry_bytes = 262144
max_batch_delay_micros = 2000
queue_capacity = 4096
candidate_conflict_fraction = 0.25
hot_key_count = 256
target_object_bytes = 8388608
target_block_bytes = 65536
candidate_min_resolved_per_second = 500
candidate_max_commit_p99_seconds = 0.25
candidate_min_logical_transactions_per_append = 16
paired_min_throughput_improvement = 4.0
max_frontier_protocol_seconds = 10.0
max_version_lag = 4096
build_profile = "release"
durability_profile = "openraft-node-journal-sync-all+durable-state-snapshot"

[[lanes]]
id = "independent-media-frontier-convergence"
primary_metric = "commit.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "independent-media-frontier-batched"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
subject = "batched_candidate"

[[workloads]]
id = "independent-media-frontier-one-entry"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
subject = "one_entry_same_durability_control"

[[workloads]]
id = "independent-media-frontier-publication-disabled"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
subject = "publication_disabled_control"

[[workloads]]
id = "independent-media-frontier-snapshot-before-sync-poison"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
negative_control = "snapshot_before_sync"

[[workloads]]
id = "independent-media-frontier-purge-before-snapshot-poison"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
negative_control = "purge_before_snapshot"

[[workloads]]
id = "independent-media-frontier-moving-frontier-poison"
lane = "independent-media-frontier-convergence"
operation = "independent_media_frontier_convergence_contract"
negative_control = "moving_frontier"

[hard_gates]
correctness_anomalies = 0
clean_source_revision = true
one_executable_digest = true
three_distinct_machine_ids = true
three_distinct_non_loopback_ips = true
three_distinct_failure_domains = true
three_distinct_stable_media_ids = true
controller_outside_node_failure_domains = true
otel_metrics_traces_and_logs_present = true
independent_request_outcomes_are_exact = true
conflict_oracle_is_exact = true
foreground_object_requests = 0
all_frontiers_are_frozen_validated_and_exact = true
durable_snapshots_reopen_exactly = true
raft_purge_is_bounded_by_durable_snapshot = true
compacted_journals_reopen_exactly = true
object_plus_suffix_reconstruction_is_exact = true
host_loss_and_empty_replacement_are_exact = true
negative_controls_detected = true
candidate_min_resolved_per_second = 500
candidate_max_commit_p99_seconds = 0.25
candidate_min_logical_transactions_per_append = 16
paired_min_throughput_improvement = 4.0
max_frontier_protocol_seconds = 10.0
max_version_lag = 4096
bounded_physical_journal_curve = true
backpressure_rejections = 0
schema_valid = true
budget_must_hold = true
