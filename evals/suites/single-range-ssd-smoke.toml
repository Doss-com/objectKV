schema_version = 1
id = "single-range-ssd-smoke-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0007-manifest-publication.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0027-retained-transaction-stream.md",
  "../../rfcs/0038-single-range-kernel-api.md",
  "../../rfcs/0039-single-range-serving-image.md",
]
dataset_generator = "deterministic-single-range-object-base-plus-versionstamped-tail-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 34816
key_count = 256
seeds = [1103]

[profiles.local-process-rocksdb-smoke]
budget_kind = "operations"
budget_limit = 100000
repeats = 1
backend = "object-store-local-fs+authority-openraft+data-openraft+rocksdb-local-fs"
publication_authority_nodes = 3
transaction_authority_nodes = 3
worker_process_starts_per_seed = 2
worker_process_kills_per_seed = 1
cache_state = "empty_worker"
serving_profile = "ssd_resident"
durability_profile = "openraft-node-journal-local-process-diagnostic"
max_local_bytes = 134217728
row_object_target_bytes = 16384
row_object_block_bytes = 4096
retained_stream_page_records = 1
hot_read_warmup_operations = 10000
hot_read_operations = 100000
kill_boundary = "initial_versionstamped_catchup_complete_before_read"
concurrent_commit_boundary = "replacement_initial_catchup_complete"
replacement_scratch = "distinct_empty_directory"

[[lanes]]
id = "single-range-ssd-smoke"
primary_metric = "operation.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "integrated-single-range-rocksdb-recovery"
lane = "single-range-ssd-smoke"
operation = "serving_worker_openraft_recovery_contract"
subject = "integrated_kernel_rocksdb"
value_bytes = 128

[hard_gates]
correctness_anomalies = 0
publication_authority_processes = 3
transaction_authority_processes = 3
worker_process_starts = 2
worker_process_kills = 1
replacement_uses_distinct_empty_scratch = true
versionstamp_cursor_resumes_inside_batch = true
set_clear_insert_and_clear_range_are_exact = true
physical_raft_journal_path_accesses = 0
complete_object_base_is_verified_before_activation = true
rocksdb_serving_image_is_generation_and_coverage_bound = true
rocksdb_local_bytes_at_most_128_mib = true
measured_reads_issue_zero_object_operations = true
candidate_uses_zero_list_operations = true
fresh_process_semantic_replay_is_byte_exact = true
schema_valid = true
budget_must_hold = true
