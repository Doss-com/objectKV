schema_version = 1
id = "process-snapshot-compaction-v1"
status = "code_complete"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0036-independent-media-frontier-convergence.md",
]
dataset_generator = "bounded-batched-state-snapshot-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 131072
key_count = 256
seeds = [5501, 5502, 5503]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
backend = "data-openraft-local-process+durable-state-snapshot+canonical-journal"
authority_processes = 3
transaction_count = 1024
transactions_per_batch = 32
live_keys = 256
value_bytes = 128
build_profile = "release"
durability_profile = "sync-snapshot+atomic-replace+sync-journal"

[[lanes]]
id = "process-snapshot-compaction"
primary_metric = "storage.amplification"
statistic = "maximum"
direction = "lower"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "process-snapshot-compaction-candidate"
lane = "process-snapshot-compaction"
operation = "process_snapshot_compaction_contract"
subject = "candidate"

[[workloads]]
id = "process-snapshot-compaction-purge-before-snapshot"
lane = "process-snapshot-compaction"
operation = "process_snapshot_compaction_contract"
negative_control = "purge_before_snapshot_poison"

[hard_gates]
correctness_anomalies = 0
three_real_openraft_data_processes = true
release_build = true
durable_snapshot_covers_purge = true
physical_journals_reclaim_bytes = true
full_quorum_restart_is_exact = true
retained_stream_restart_is_exact = true
exact_retry_after_restart = true
suffix_commit_after_restart = true
purge_before_snapshot_poison_detected = true
schema_valid = true
budget_must_hold = true
