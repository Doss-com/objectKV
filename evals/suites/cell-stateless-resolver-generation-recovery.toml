schema_version = 1
id = "cell-stateless-resolver-generation-recovery-v0"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0041-certified-staged-head-generation-takeover.md",
  "../../rfcs/0043-multi-record-staged-prefix-recovery.md",
  "../../rfcs/0048-partitioned-resolver-agreement.md",
  "../../rfcs/0049-stateless-resolver-generation-recovery.md",
]
dataset_generator = "deterministic-cell-stateless-resolver-generation-recovery-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 65536
key_count = 240
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 2400
repeats = 1
backend = "transaction-openraft+stateless-resolver-processes"
transaction_authority_nodes = 3
transaction_authority_quorum = 2
resolver_partitions = 3
resolver_processes = 3
resolver_map_epoch = 1
transaction_system_generations = 2
attempts_per_seed = 600
batch_size = 8

[[lanes]]
id = "cell-stateless-resolver-generation-recovery"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "cell-recovers-stateless-resolvers-by-generation"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"

[[workloads]]
id = "cell-continues-generation-after-resolver-loss"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "continue_after_resolver_loss"

[[workloads]]
id = "cell-activates-successor-before-old-fence"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "activate_before_old_fence"

[[workloads]]
id = "cell-counts-old-generation-resolver-reply"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "accept_old_generation_reply"

[[workloads]]
id = "cell-admits-read-below-recovery-floor"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "read_below_recovery_floor"

[[workloads]]
id = "cell-publishes-unresolved-old-generation-work"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "publish_unresolved_old_work"

[[workloads]]
id = "cell-omits-durable-head-from-recovery"
lane = "cell-stateless-resolver-generation-recovery"
operation = "cell_stateless_resolver_generation_recovery_contract"
negative_control = "omit_durable_head"

[hard_gates]
correctness_anomalies = 0
transaction_authority_nodes = 3
transaction_authority_quorum = 2
resolver_partitions = 3
resolver_processes = 3
transaction_system_generations = 2
transaction_attempts_per_seed = 600
batch_size = 8
partitioned_commits_subset_of_centralized_oracle = true
centralized_conflicts_rejected_by_partitioned_path = true
partitioned_rows_match_authoritative_outcomes = true
partitioned_envelope_chain_matches_authoritative_outcomes = true
all_commits_have_complete_resolver_agreement = true
all_commits_have_replicated_authority_durability = true
safe_false_conflicts_never_commit = true
resolver_failure_stops_old_generation = true
old_generation_fenced_before_successor = true
recovery_floor_includes_durable_head = true
successor_resolver_state_starts_empty = true
successor_reads_at_or_above_recovery_floor = true
old_generation_requests_rejected = true
old_generation_replies_rejected = true
unresolved_old_generation_work_not_visible = true
abandoned_work_retries_with_new_identity = true
resolver_durable_syncs = 0
resolver_finalization_rpcs = 0
dependency_graph_acyclic = true
commit_envelope_chain_valid = true
exact_canonical_replay = true
negative_control_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.profile.hash",
  "okv.eval.candidate.commit",
  "okv.eval.backend",
]
