[[workloads]]
id = "provider-cache-moving-hotset-10pct"
lane = "provider-bound-cache-economics"
operation = "provider_bound_cache_economics"
distribution = "moving_hotset"
hotset_fraction_ppm = 100000
hot_read_fraction_ppm = 900000
hotset_shift_every = 1000
cache_fraction_ppm = 100000
view_reopen_every = 0

[[workloads]]
id = "provider-cache-moving-hotset-25pct"
lane = "provider-bound-cache-economics"
operation = "provider_bound_cache_economics"
distribution = "moving_hotset"
hotset_fraction_ppm = 100000
hot_read_fraction_ppm = 900000
hotset_shift_every = 1000
cache_fraction_ppm = 250000
view_reopen_every = 0

[[workloads]]
id = "provider-cache-zipf099-10pct-view-churn"
lane = "provider-bound-cache-economics"
operation = "provider_bound_cache_economics"
distribution = "zipfian"
zipf_theta_milli = 990
cache_fraction_ppm = 100000
view_reopen_every = 1000

[[workloads]]
id = "provider-cache-unbounded-control"
lane = "provider-bound-cache-economics"
operation = "provider_bound_cache_economics"
