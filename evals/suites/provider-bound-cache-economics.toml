distribution = "zipfian"
zipf_theta_milli = 990
cache_fraction_ppm = 100000
view_reopen_every = 0
negative_control = "perturb_replay_trace"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 5
process_boundary_must_be_exercised = true
exact_point_reads = true
authority_selects_provider_closure_digest = true
every_provider_read_uses_exact_revision = true
unversioned_fallbacks = 0
classified_reads_equal_measured_reads = true
persistent_cache_bound_must_hold = true
trace_and_reuse_distance_replay_exact = true
requested_view_reopens_must_execute = true
request_byte_latency_rss_and_cost_receipts_required = true
negative_controls_must_discard = 4
scratch_prefix_cleanup_must_complete = true
otel_required_for_gcs = true
schema_valid = true
budget_must_hold = true

[calibration_targets]
provider_miss_ratio = 0.025
provider_hit_ratio = 0.975
persistent_cache_hit_p99_seconds = 0.001
provider_miss_p99_seconds = 0.1
provider_bytes_per_miss = 131072
max_peak_rss_bytes = 1073741824
warmed_million_point_request_cost_usd = 0.01
cloud_claimed = false
