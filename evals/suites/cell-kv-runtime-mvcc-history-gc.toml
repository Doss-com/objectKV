schema_version = 1
id = "cell-kv-runtime-mvcc-history-gc-v0"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0003-immutable-segment-contract.md",
  "../../rfcs/0031-slatedb-active-output-and-orphan-gc.md",
  "../../rfcs/0035-publication-gc-root-graph.md",
  "../../rfcs/0058-kv-runtime-exact-version-read.md",
  "../../rfcs/0059-kv-runtime-snapshot-floor-and-history-gc.md",
]
dataset_generator = "deterministic-retained-mvcc-history-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 67108864
key_count = 1024
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 3600.0
repeats = 1
backend = "local-process+slatedb-objectkv-mvcc-gc-v1"
candidate_surface = "crates/okv-slate/src/lib.rs,crates/okv-slate/src/mvcc_retention.rs,crates/okv-slate/src/mvcc_gc_curve.rs,crates/okv-eval/src/main.rs,evals/metrics.toml,evals/suites/cell-kv-runtime-mvcc-history-gc.toml"
key_count = 1024
value_bytes = 256
max_rss_bytes = 1073741824
worker_timeout_millis = 120000

[[lanes]]
id = "kv-runtime-mvcc-history-gc"
primary_metric = "kv_runtime.mvcc_gc_post_physical_amplification"
statistic = "median"
direction = "lower"
practical_improvement_fraction = 0.10

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "mvcc-gc-depth-256-window-1"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 256
retained_versions = 1
flush_stride = 32

[[workloads]]
id = "mvcc-gc-depth-256-window-16"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 256
retained_versions = 16
flush_stride = 32

[[workloads]]
id = "mvcc-gc-depth-256-window-64"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 256
retained_versions = 64
flush_stride = 32

[[workloads]]
id = "mvcc-gc-ignores-lease-floor"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 16
retained_versions = 4
flush_stride = 2
negative_control = "ignore_lease_floor"

[[workloads]]
id = "mvcc-gc-drops-floor-anchor"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 16
retained_versions = 4
flush_stride = 2
negative_control = "drop_floor_anchor"

[[workloads]]
id = "mvcc-gc-drops-tombstone-anchor"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 16
retained_versions = 4
flush_stride = 2
negative_control = "drop_tombstone_anchor"

[[workloads]]
id = "mvcc-gc-reloads-floor-during-job"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 16
retained_versions = 4
flush_stride = 2
negative_control = "reload_floor_during_job"

[[workloads]]
id = "mvcc-gc-claims-without-publication"
lane = "kv-runtime-mvcc-history-gc"
operation = "kv_runtime_mvcc_history_gc_curve"
history_depth = 16
retained_versions = 4
flush_stride = 2
negative_control = "claim_collection_without_publication"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
slatedb_revision_exact = true
objectkv_serving_profile_exact = true
config_exact = true
publication_exact = true
frozen_floor_exact = true
compaction_topology_exact = true
filter_accounted = true
live_bytes_reduced = true
exact_reads = true
read_bounds_exact = true
close_reopen_exact = true
safety_bounds_held = true
object_io_accounted = true
semantic_replay_exact = true
negative_control_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
