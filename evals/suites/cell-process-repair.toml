schema_version = 1
id = "cell-process-repair-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
]
dataset_generator = "deterministic-cell-process-repair-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 0
key_count = 2
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "events"
budget_limit = 70
repeats = 1
backend = "process-local-fs"
nodes = 4
consensus_library = "openraft-0.9.25"
transport = "tokio-tcp"
transaction_authority = "centralized-state-machine-v0"
state_machine_recovery = "fresh-learner-snapshot-plus-retained-suffix-v0"

[[lanes]]
id = "fresh-incarnation-learner-repair"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "cell-process-fresh-learner-repair"
lane = "fresh-incarnation-learner-repair"
operation = "cell_process_transaction_contract"
mode = "fresh_learner_repair"

[[workloads]]
id = "cell-process-log-only-learner"
lane = "fresh-incarnation-learner-repair"
operation = "cell_process_transaction_contract"
negative_control = "log_only_learner_as_repair"

[hard_gates]
correctness_anomalies = 0
replacement_uses_fresh_node_identity = true
authority_snapshot_installed_on_learner = true
retained_suffix_replayed_after_snapshot = true
learner_restart_exact = true
retained_outcomes_exact_on_learner = true
exact_fresh_process_replay = true
semantic_operations_exercised = true
schema_valid = true
budget_must_hold = true
