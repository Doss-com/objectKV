schema_version = 1
id = "commit-proxy-object-frontier-v1"
status = "code_complete"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0030-authenticated-object-frontier.md",
  "../../rfcs/0033-commit-proxy-batch-closure.md",
  "../../rfcs/0035-concurrent-commit-object-frontier.md",
]
dataset_generator = "frozen-prefix-concurrent-conflict-suffix-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 196608
key_count = 1536
seeds = [5101, 5102, 5103]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
backend = "object-store-local-fs+publication-openraft+data-openraft+stable-journal"
publication_authority_nodes = 3
data_authority_nodes = 3
prefix_transaction_count = 512
suffix_transaction_count = 1024
value_bytes = 128
concurrent_clients = 64
max_batch_items = 32
max_entry_bytes = 262144
max_batch_delay_micros = 2000
queue_capacity = 2048
candidate_conflict_fraction = 0.25
high_conflict_fraction = 0.75
hot_key_count = 64
candidate_min_resolved_per_second = 700
no_conflict_min_resolved_per_second = 850
candidate_max_commit_p99_seconds = 0.15
candidate_min_logical_transactions_per_append = 16
paired_min_throughput_improvement = 4.0
max_frontier_protocol_seconds = 2.0
build_profile = "release"
durability_profile = "openraft-node-journal-sync-all"

[[lanes]]
id = "commit-proxy-object-frontier"
primary_metric = "commit.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "commit-proxy-frontier-candidate"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
subject = "quarter_conflict_candidate"
window_class = "64-callers-32-items-concurrent-frontier"

[[workloads]]
id = "commit-proxy-frontier-no-conflict-control"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
subject = "no_conflict_control"
window_class = "64-callers-32-items-no-conflict"

[[workloads]]
id = "commit-proxy-frontier-high-conflict-control"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
subject = "high_conflict_control"
window_class = "64-callers-32-items-high-conflict"

[[workloads]]
id = "commit-proxy-frontier-one-entry-control"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
subject = "one_entry_same_durability_control"
window_class = "64-callers-one-entry-concurrent-frontier"

[[workloads]]
id = "commit-proxy-frontier-moving-frontier-poison"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
negative_control = "moving_frontier_poison"
window_class = "unsafe-moving-frontier"

[[workloads]]
id = "commit-proxy-frontier-premature-pop-poison"
lane = "commit-proxy-object-frontier"
operation = "commit_proxy_object_frontier_contract"
negative_control = "premature_pop_poison"
window_class = "unsafe-unprotected-pop"

[hard_gates]
correctness_anomalies = 0
publication_authority_processes = 3
data_authority_processes = 3
release_build = true
independent_request_outcomes_are_exact = true
conflict_oracle_is_exact = true
ordered_versionstamps_are_exact = true
foreground_object_requests = 0
pending_frontier_precedes_pop = true
persisted_floor_equals_frozen_object_version = true
retained_suffix_is_strictly_newer_than_object_version = true
object_plus_suffix_reconstruction_is_exact = true
leader_failover_restart_and_fresh_replay_are_exact = true
concurrent_suffix_resolutions_minimum = 1
candidate_min_resolved_per_second = 700
no_conflict_min_resolved_per_second = 850
candidate_max_commit_p99_seconds = 0.15
candidate_min_logical_transactions_per_append = 16
paired_min_throughput_improvement = 4.0
max_frontier_protocol_seconds = 2.0
moving_frontier_poison_detected = true
premature_pop_poison_detected = true
schema_valid = true
budget_must_hold = true
