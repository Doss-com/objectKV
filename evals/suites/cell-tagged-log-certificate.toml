schema_version = 1
id = "cell-tagged-log-certificate-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0038-range-tagged-transaction-log.md",
  "../../rfcs/0039-commit-visibility-after-tagged-log-durability.md",
  "../../rfcs/0040-authenticated-tagged-log-certificates.md",
]
dataset_generator = "deterministic-cell-tagged-log-certificate-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 4096
key_count = 1
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 96
repeats = 1
backend = "transaction-openraft+signed-tagged-tlog-certificates+process-proxies"
transaction_authority_nodes = 3
tagged_tlog_sets = 2
tagged_tlog_nodes_per_set = 3
tagged_tlog_quorum = 2
commit_proxy_processes = 3
commit_proxy_kills = 2
serving_workers = 1
expected_baseline_frontier = 10
expected_target_version = 11

[[lanes]]
id = "cell-tagged-log-certificate"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "cell-commit-after-signed-log-certificates"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"

[[workloads]]
id = "cell-commit-forged-unsigned-node-list"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"
negative_control = "unsigned_node_list"

[[workloads]]
id = "cell-commit-duplicated-log-attestation"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"
negative_control = "duplicate_attestation"

[[workloads]]
id = "cell-commit-wrong-log-set-attestation"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"
negative_control = "wrong_log_set_attestation"

[[workloads]]
id = "cell-commit-tampered-log-statement"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"
negative_control = "tampered_statement"

[[workloads]]
id = "cell-commit-obsolete-log-policy"
lane = "cell-tagged-log-certificate"
operation = "cell_tagged_log_certificate_contract"
negative_control = "obsolete_policy_epoch"

[hard_gates]
correctness_anomalies = 0
transaction_authority_nodes = 3
tagged_tlog_sets = 2
tagged_tlog_nodes_per_set = 3
tagged_tlog_quorum = 2
commit_proxy_process_starts_per_seed = 3
commit_proxy_process_kills_per_seed = 2
serving_worker_process_starts_per_seed = 1
log_set_policy_independent_of_transaction = true
attestations_follow_local_durability = true
certificate_statement_binds_exact_transaction = true
certificate_signers_are_distinct_policy_members = true
every_required_certificate_reaches_quorum = true
authority_rejects_unsigned_node_lists = true
authority_rejects_duplicate_signers = true
authority_rejects_wrong_log_set_signers = true
authority_rejects_tampered_statements = true
authority_rejects_obsolete_policy_epochs = true
visibility_waits_for_verified_certificates = true
visible_publish_exactly_once = true
retry_returns_retained_outcome = true
fresh_worker_reconstructs_visible_state = true
exact_canonical_replay = true
negative_control_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
schema_version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.profile.hash",
  "okv.eval.candidate.commit",
  "okv.eval.backend",
]
