schema_version = 1
id = "object-fixture-gcs-preflight-v1"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0044-content-addressed-object-frontier-fixtures.md",
  "../../docs/research/reviews/fable-object-frontier-fixture-review-2026-08-28.md",
  "../schema/benchmark-machine-receipt-v1.schema.json",
]
dataset_generator = "content-addressed-single-range-fixture-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["gcp-r0-64m", "gcp-r0-reuse-poison"]

[dataset.gcp-r0-64m]
logical_bytes = 67108864
key_count = 65536
seeds = [4244]

[dataset.gcp-r0-reuse-poison]
logical_bytes = 4194304
key_count = 4096
seeds = [4244]

[profiles.gcp-r0-64m]
budget_kind = "seconds"
budget_limit = 300
repeats = 1
evidence_class = "mechanism"
backend = "object-store-gcs+data-openraft-local-process+rocksdb-resident+persisted-fixture"
value_bytes = 1024
target_object_bytes = 8388608
target_block_bytes = 65536
max_local_bytes = 536870912
block_cache_bytes = 33554432
max_transaction_authority_scratch_ratio = 0.25
minimum_exact_descriptor_reopens = 3
gcs_prefix_env = "OKV_EVAL_OBJECT_FIXTURE_PREFIX"
machine_receipt_env = "OKV_EVAL_MACHINE_RECEIPT"
machine_receipt_schema = "../schema/benchmark-machine-receipt-v1.schema.json"
build_profile = "release"

[profiles.gcp-r0-reuse-poison]
budget_kind = "seconds"
budget_limit = 300
repeats = 1
evidence_class = "contract"
backend = "object-store-gcs+data-openraft-local-process+rocksdb-resident+persisted-fixture"
value_bytes = 1024
target_object_bytes = 1048576
target_block_bytes = 65536
max_local_bytes = 134217728
block_cache_bytes = 16777216
max_transaction_authority_scratch_ratio = 0.25
minimum_exact_descriptor_reopens = 3
gcs_prefix_env = "OKV_EVAL_OBJECT_FIXTURE_PREFIX"
machine_receipt_env = "OKV_EVAL_MACHINE_RECEIPT"
machine_receipt_schema = "../schema/benchmark-machine-receipt-v1.schema.json"
build_profile = "release"

[[lanes]]
id = "object-fixture-gcs-preflight"
primary_metric = "object_fixture.setup_seconds"
statistic = "maximum"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "persisted-fixture-abba"
lane = "object-fixture-gcs-preflight"
operation = "object_fixture_gcs_preflight_contract"
subject = "abba"

[[workloads]]
id = "persisted-fixture-reuse-bypass"
lane = "object-fixture-gcs-preflight"
operation = "object_fixture_gcs_preflight_contract"
negative_control = "reuse_bypass_poison"

[hard_gates]
correctness_anomalies = 0
gcs_backend_exact = true
one_fixture_identity = true
one_tail_identity = true
abba_subject_order = true
fresh_subject_processes = true
minimum_three_exact_descriptor_reopens = true
one_empty_anchor_per_authority = true
zero_base_values_in_txlog = true
complete_closure_at_anchor = true
setup_within_300_seconds = true
transaction_authority_scratch_at_most_0_25x = true
resident_logical_images_equal = true
post_activation_zero_object_requests = true
reuse_bypass_poison_detected = true
release_build = true
schema_valid = true
budget_must_hold = true
