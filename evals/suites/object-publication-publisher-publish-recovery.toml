schema_version = 1
id = "object-publication-publisher-publish-recovery-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0007-manifest-publication.md",
  "../../rfcs/0014-real-object-publication-adapter.md",
  "../../rfcs/0015-replicated-publication-authority.md",
  "../../rfcs/0016-publication-worker-recovery.md",
  "../../rfcs/0017-publisher-process-recovery.md",
  "../../rfcs/0018-publisher-ambiguous-put-recovery.md",
  "../../rfcs/0019-publisher-ambiguous-manifest-recovery.md",
  "../../rfcs/0020-publisher-lost-publish-response-recovery.md",
]
dataset_generator = "deterministic-publisher-lost-publish-response-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 4096
key_count = 3
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "events"
budget_limit = 42
repeats = 1
backend = "object-store-local-fs+process-openraft"
authority_nodes = 3
publisher_processes = 1
consensus_library = "openraft-0.9.25"
transport = "tokio-tcp"
stable_storage = "independent-node-journals"
worker_recovery = "empty-scratch"
fault_injection = "successful-publish-apply-response-dropped"
kill_boundary = "publish-quorum-apply-before-outcome-recovery"
authority_leader_failover = true

[[lanes]]
id = "publisher-publish-recovery"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "publisher-publish-unknown-restart"
lane = "publisher-publish-recovery"
operation = "publication_publisher_publish_recovery_contract"

[[workloads]]
id = "publisher-publish-unknown-convergence-only"
lane = "publisher-publish-recovery"
operation = "publication_publisher_publish_recovery_contract"
negative_control = "convergence_only_duplicate_publish"

[hard_gates]
correctness_anomalies = 0
active_generation_authorizes_publisher = true
prepare_and_outcome_are_quorum_durable = true
exact_closure_precedes_publish_attempt = true
publish_effect_exists_with_unknown_response = true
root_and_intent_transition_is_atomic_at_fault_barrier = true
original_publish_outcome_is_quorum_durable = true
publisher_is_killed_after_publish_effect = true
authority_leader_is_killed_after_dropped_reply = true
replacement_uses_empty_scratch = true
replacement_recovers_exact_job_and_publish_identity = true
exact_publish_retry_replays_original_outcome = true
publication_transition_applies_exactly_once = true
replacement_issues_no_object_puts = true
reader_walks_exact_visible_closure = true
fresh_process_replay_is_byte_exact = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
