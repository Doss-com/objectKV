schema_version = 1
id = "provider-bound-range-image-io-v0"
status = "frozen-before-implementation"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0070-bounded-range-image-io.md",
  "../../rfcs/0069-assigned-range-placement.md",
  "../../rfcs/0066-provider-bound-range-read.md",
]
dataset_generator = "provider-bound-range-image-io-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-path]
logical_bytes = 33554432
key_count = 4096
value_bytes = 8192
seeds = [724851, 724877, 724901, 724921, 724939]

[profiles.local-path]
budget_kind = "seconds"
budget_limit = 900
repeats = 1
backend = "retained-local-range-image-process"
warmup_point_reads = 256
measured_point_reads = 4096
maximum_block_bytes = 65536
maximum_open_read_operations = 4
maximum_open_read_bytes = 524288
maximum_point_read_operations_p99 = 2
maximum_point_read_bytes_p99 = 65536
maximum_point_p99_seconds = 0.001
os_page_cache_controlled = false
scratch_root_env = "OKV_EVAL_SCRATCH_ROOT"
scratch_cleanup_required = true

[[lanes]]
id = "provider-bound-range-image-io"
objective = "Minimize explicit local-file bytes per exact point while enforcing bounded application memory and zero provider work."
primary_metric = "range_image.point_file_read_bytes_p99"
statistic = "p50"
direction = "lower"
practical_improvement_fraction = 0.25

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes.constraints]]
metric = "range_image.image_to_memory_ratio"
statistic = "p50"
op = "ge"
value = 8.0

[[lanes.constraints]]
metric = "range_image.accounted_resident_bytes"
statistic = "maximum"
op = "le"
value = 4194304.0

[[lanes.constraints]]
metric = "range_image.open_file_read_operations"
statistic = "maximum"
op = "le"
value = 4.0

[[lanes.constraints]]
metric = "range_image.open_file_read_bytes"
statistic = "maximum"
op = "le"
value = 524288.0

[[lanes.constraints]]
metric = "range_image.point_file_read_operations_p99"
statistic = "maximum"
op = "le"
value = 2.0

[[lanes.constraints]]
metric = "range_image.point_file_read_bytes_p99"
statistic = "maximum"
op = "le"
value = 65536.0

[[lanes.constraints]]
metric = "range_image.point_p99"
statistic = "p50"
op = "le"
value = 0.001

[[lanes.constraints]]
metric = "provider_bound.post_ready_provider_requests"
statistic = "total"
op = "eq"
value = 0.0

[[lanes.constraints]]
metric = "provider_bound.post_ready_provider_bytes"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "range-image-full-uniform-4m"
lane = "provider-bound-range-image-io"
operation = "provider_bound_range_image_io_curve"
logical_range_count = 1
assigned_range_index = 0
reader_memory_budget_bytes = 4194304
distribution = "uniform"
process_reopen = false
scan = false

