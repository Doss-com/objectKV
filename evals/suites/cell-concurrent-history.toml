schema_version = 1
id = "cell-concurrent-history-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0029-cell-concurrent-history-contract.md",
]
dataset_generator = "deterministic-cell-concurrent-history-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 0
key_count = 901
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "operations"
budget_limit = 3000
repeats = 1
backend = "process-local-fs"
nodes = 3
consensus_library = "openraft-0.9.25"
transport = "tokio-tcp"
transaction_authority = "centralized-state-machine-v0"
transactions_per_seed = 1000

[[lanes]]
id = "cell-concurrent-serializability"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "cell-concurrent-history"
lane = "cell-concurrent-serializability"
operation = "cell_concurrent_history_contract"
transactions = 1000

[[workloads]]
id = "cell-concurrent-omit-hot-read-conflicts"
lane = "cell-concurrent-serializability"
operation = "cell_concurrent_history_contract"
transactions = 1000
negative_control = "omit_hot_read_conflicts"

[hard_gates]
correctness_anomalies = 0
transactions_per_seed = 1000
hot_key_one_winner = true
disjoint_multi_key_atomicity = true
blind_writes_follow_commit_order = true
unique_commit_sequences = true
lost_reply_after_apply = true
successor_recovers_durable_outcome = true
duplicate_retry_returns_original_outcome = true
restarted_node_converges = true
commit_envelope_chain_valid = true
exact_canonical_replay = true
negative_control_must_discard = true
schema_valid = true
budget_must_hold = true
