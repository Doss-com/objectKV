schema_version = 1
id = "cell-mvcc-gc-authority-composition-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0031-slatedb-active-output-and-orphan-gc.md",
  "../../rfcs/0035-publication-gc-root-graph.md",
  "../../rfcs/0059-kv-runtime-snapshot-floor-and-history-gc.md",
  "../../rfcs/0060-replicated-snapshot-lease-authority.md",
]
dataset_generator = "deterministic-physical-mvcc-authority-composition-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 32768
key_count = 32
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 32
repeats = 1
backend = "local-process+slatedb-mvcc-gc+openraft-publication-authority"
authority_nodes = 3
consensus_library = "openraft-0.9.25"
collector_boundary = "dedicated-child-process"
serving_root_binding = "read-only-authority-bound-manifest-view"
storage_engine = "slatedb-pinned-revision"
physical_closure = "manifest-plus-every-live-sst"

[[lanes]]
id = "mvcc-gc-authority-composition"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "mvcc-gc-authority-physical-failover"
lane = "mvcc-gc-authority-composition"
operation = "mvcc_gc_authority_composition_contract"

[[workloads]]
id = "mvcc-gc-authority-omit-output-sst"
lane = "mvcc-gc-authority-composition"
operation = "mvcc_gc_authority_composition_contract"
negative_control = "omit_output_sst"

[[workloads]]
id = "mvcc-gc-authority-semantic-digest-as-manifest"
lane = "mvcc-gc-authority-composition"
operation = "mvcc_gc_authority_composition_contract"
negative_control = "semantic_digest_as_manifest"

[[workloads]]
id = "mvcc-gc-authority-skip-failover"
lane = "mvcc-gc-authority-composition"
operation = "mvcc_gc_authority_composition_contract"
negative_control = "skip_authority_failover"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
authority_issued_before_compaction = true
authority_failover_exercised = true
physical_input_matches_token = true
physical_output_closure_is_exact = true
authority_root_held_until_authority_publish = true
authority_bound_reads_are_exact = true
authority_published_submitted_receipt = true
root_and_frontier_advance_together = true
physical_floor_and_latest_reads_are_exact = true
semantic_replay_exact = true
negative_control_must_discard = true
collector_process_boundary = true
serving_root_binding = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
