schema_version = 1
id = "generation-recovery-certificates-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
]
dataset_generator = "deterministic-nine-process-generation-certificate-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 0
key_count = 0
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "events"
budget_limit = 50
repeats = 1
backend = "process-local-fs"
authority_nodes = 3
generation_one_voters = 3
generation_two_voters = 3
consensus_library = "openraft-0.9.25"
signature_algorithm = "ed25519"
transport = "tokio-tcp"
membership_handoff = "quiesced-joint-log"

[[lanes]]
id = "generation-certificates"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "generation-certificate-handoff"
lane = "generation-certificates"
operation = "generation_process_contract"

[[workloads]]
id = "generation-certificate-single-signer-fence"
lane = "generation-certificates"
operation = "generation_process_contract"
negative_control = "accept_single_signer_fence"

[[workloads]]
id = "generation-certificate-tampered-fence-position"
lane = "generation-certificates"
operation = "generation_process_contract"
negative_control = "accept_tampered_fence_position"

[[workloads]]
id = "generation-certificate-duplicate-recovery-signer"
lane = "generation-certificates"
operation = "generation_process_contract"
negative_control = "accept_duplicate_recovery_signer"

[[workloads]]
id = "generation-certificate-stale-recovery-id"
lane = "generation-certificates"
operation = "generation_process_contract"
negative_control = "accept_stale_recovery_certificate"

[[workloads]]
id = "generation-certificate-wrong-membership"
lane = "generation-certificates"
operation = "generation_process_contract"
negative_control = "accept_wrong_recovery_membership"

[hard_gates]
correctness_anomalies = 0
fence_certificate_requires_active_voter_quorum = true
fence_certificate_binds_exact_barrier_position = true
recovery_certificate_requires_pending_voter_quorum = true
recovery_certificate_rejects_duplicate_signers = true
certificate_binds_cell_generation_recovery_and_membership = true
membership_handoff_preserves_exact_log = true
fresh_process_replay_is_byte_exact = true
schema_valid = true
budget_must_hold = true
