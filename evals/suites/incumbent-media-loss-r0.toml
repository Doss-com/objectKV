schema_version = 1
id = "incumbent-media-loss-r0-v1"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../docs/PRODUCT-SPEC-SHEET.md",
  "../../docs/research/provider-media-loss-gp2.5.3.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0041-incumbent-transaction-plane-adapter.md",
  "../schema/benchmark-machine-receipt-v1.schema.json",
  "../schema/provider-media-loss-receipt-v1.schema.json",
]
dataset_generator = "deterministic-foundationdb-media-loss-lifecycle-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["gcp-r0-foundationdb-media-loss"]

[dataset.gcp-r0-foundationdb-media-loss]
logical_bytes = 44000
key_count = 1000
value_bytes = 32
seeds = [2026082703]

[profiles.gcp-r0-foundationdb-media-loss]
budget_kind = "operations"
budget_limit = 10000
repeats = 1
topology = "sequential-private-source-and-restore-foundationdb-7.4.6-with-regional-gcs"
durability_profile = "r0-correctness-only-distinct-source-and-destination-provider-media"
cache_state = "fresh-destination-provider"
machine_receipt_env = "OKV_EVAL_MACHINE_RECEIPT"
machine_receipt_schema = "../schema/benchmark-machine-receipt-v1.schema.json"
provider_receipt_schema = "../schema/provider-media-loss-receipt-v1.schema.json"

[[lanes]]
id = "provider-media-loss"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "foundationdb-objectkv-media-loss-lifecycle"
lane = "provider-media-loss"
operation = "foundationdb_objectkv_media_loss_lifecycle"
subject = "foundationdb-7.4.6"
receipt_env = "OKV_PROVIDER_MEDIA_LOSS_RECEIPT"

[[workloads]]
id = "foundationdb-restore-with-hidden-source-media-poison"
lane = "provider-media-loss"
operation = "foundationdb_objectkv_media_loss_lifecycle"
subject = "foundationdb-7.4.6"
receipt_env = "OKV_PROVIDER_MEDIA_LOSS_POISON_RECEIPT"
negative_control = "restore_with_hidden_source_media"

[hard_gates]
correctness_anomalies = 0
source_and_destination_provider_identities_differ = true
source_instance_is_absent_before_restore = true
source_boot_disk_is_absent_before_restore = true
source_data_disk_is_absent_before_restore = true
destination_is_empty_before_restore = true
named_object_generations_and_hashes_match = true
restore_chunks_are_idempotent = true
restored_state_digest_is_exact = true
destination_activates_after_ready = true
fresh_destination_commit_succeeds = true
restore_has_no_source_provider_inputs = true
hidden_source_media_poison_is_detected = true
otel_logs_metrics_traces = true
schema_valid = true
budget_must_hold = true
