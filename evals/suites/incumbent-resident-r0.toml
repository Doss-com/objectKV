schema_version = 1
id = "incumbent-resident-r0-v1"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../docs/PRODUCT-SPEC-SHEET.md",
  "../../docs/REAL-INFRA-EVALS.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0027-retained-transaction-stream.md",
  "../../rfcs/0041-incumbent-transaction-plane-adapter.md",
  "../schema/benchmark-machine-receipt-v1.schema.json",
]
dataset_generator = "deterministic-incumbent-plane-history-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["gcp-r0-foundationdb"]

[dataset.gcp-r0-foundationdb]
logical_bytes = 67108864
key_count = 65536
seeds = [1103, 2207, 3301]

[profiles.gcp-r0-foundationdb]
budget_kind = "operations"
budget_limit = 3000000
repeats = 5
topology = "single-private-r0-runner-foundationdb-7.4.6"
durability_profile = "single-machine-semantic-and-overhead-spike-not-production-ha"
cache_state = "warm-provider-cache"
transaction_operations = 200000
warmup_operations = 20000
retained_change_limit = 1000
machine_receipt_env = "OKV_EVAL_MACHINE_RECEIPT"
machine_receipt_schema = "../schema/benchmark-machine-receipt-v1.schema.json"
required_hot_scratch_interface = "nvme"

[[lanes]]
id = "resident-plane-lifecycle"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes]]
id = "hot-ssd"
primary_metric = "commit.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.25

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes.comparison_constraints]]
id = "objectkv_commit_p99"
candidate_metric = "commit.latency"
control_metric = "commit.latency"
unit = "s"
direction = "lower"
max_regression_fraction = 0.25

[[workloads]]
id = "foundationdb-objectkv-media-loss-lifecycle"
lane = "resident-plane-lifecycle"
operation = "foundationdb_objectkv_media_loss_lifecycle"
subject = "foundationdb-7.4.6"

[[workloads]]
id = "foundationdb-restore-with-hidden-source-media-poison"
lane = "resident-plane-lifecycle"
operation = "foundationdb_objectkv_media_loss_lifecycle"
subject = "foundationdb-7.4.6"
negative_control = "restore_with_hidden_source_media"

[[workloads]]
id = "foundationdb-omit-retained-change-poison"
lane = "resident-plane-lifecycle"
operation = "foundationdb_objectkv_lifecycle"
subject = "foundationdb-7.4.6"
negative_control = "omit_retained_change"

[[workloads]]
id = "foundationdb-accept-unknown-without-outcome-poison"
lane = "resident-plane-lifecycle"
operation = "foundationdb_objectkv_lifecycle"
subject = "foundationdb-7.4.6"
negative_control = "accept_unknown_without_outcome"

[[workloads]]
id = "foundationdb-restore-without-generation-poison"
lane = "resident-plane-lifecycle"
operation = "foundationdb_objectkv_lifecycle"
subject = "foundationdb-7.4.6"
negative_control = "restore_without_generation"

[[workloads]]
id = "foundationdb-objectkv-hot-path"
lane = "hot-ssd"
operation = "foundationdb_objectkv_hot_path"
subject = "objectkv-retained-change-and-outcome"
distribution = "hotset-80-20"
value_bytes = 1024

[[workloads]]
id = "foundationdb-direct-hot-control"
lane = "hot-ssd"
operation = "foundationdb_direct_hot_control"
subject = "direct-foundationdb"
distribution = "hotset-80-20"
value_bytes = 1024

[hard_gates]
correctness_anomalies = 0
strict_serializable_write_skew = true
atomic_user_change_and_outcome = true
unknown_result_retry_is_exact = true
retained_change_order_is_complete = true
object_frontier_follows_complete_closure = true
empty_generation_restore_is_exact = true
source_provider_media_is_removed_before_restore = true
candidate_and_control_share_machine_receipt = true
candidate_and_control_share_batch_id = true
candidate_and_control_share_source_and_lockfile = true
objectkv_commit_throughput_at_least_75_percent_of_direct = true
objectkv_commit_p99_at_most_125_percent_of_direct = true
minimum_samples_per_subject = 5
machine_receipt_names_local_nvme = true
otel_logs_metrics_traces = true
schema_valid = true
budget_must_hold = true
