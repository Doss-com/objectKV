schema_version = 1
id = "phase0-slate-orphan-gc-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0003-immutable-segment-contract.md",
  "../../rfcs/0025-slatedb-separate-compaction-contract.md",
  "../../rfcs/0028-slatedb-coordinator-recovery-contract.md",
  "../../rfcs/0031-slatedb-active-output-and-orphan-gc.md",
  "../../docs/research/slatedb-seams-e016197.md",
]
dataset_generator = "deterministic-slate-orphan-gc-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-orphan-gc-8mib]
logical_bytes = 8388608
key_count = 8192
seeds = [1103]

[dataset.confirm-orphan-gc-8mib]
logical_bytes = 8388608
key_count = 8192
seeds = [2207, 3301]

[profiles.local-orphan-gc-8mib]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
backend = "slatedb-local-fs-process"
slatedb_revision = "e0161973d8d7ffdede7c44725729838811674e99"
overwrite_rounds = 8
compacted_timeout_millis = 15000
completion_timeout_millis = 15000

[profiles.confirm-orphan-gc-8mib]
budget_kind = "seconds"
budget_limit = 360
repeats = 1
backend = "slatedb-local-fs-process"
slatedb_revision = "e0161973d8d7ffdede7c44725729838811674e99"
overwrite_rounds = 8
compacted_timeout_millis = 15000
completion_timeout_millis = 15000

[[lanes]]
id = "slatedb-orphan-gc"
primary_metric = "gc.orphan_collection_duration"
statistic = "median"
direction = "lower"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "slatedb-orphan-gc"
lane = "slatedb-orphan-gc"
operation = "slatedb_phase0_orphan_gc_contract"

[[workloads]]
id = "slatedb-orphan-gc-dry-run"
lane = "slatedb-orphan-gc"
operation = "slatedb_phase0_orphan_gc_contract"
negative_control = "dry_run_orphan_deletion"

[hard_gates]
correctness_anomalies = 0
orphan_gc_overwrite_l0_materialized = true
active_compacted_output_persisted = true
active_compacted_output_survived_gc = true
preserved_output_committed_after_gc = true
aged_unreferenced_sst_created = true
aged_unreferenced_sst_deleted = true
exact_latest_overwrite_after_orphan_gc = true
metadata_bounded_reopen_after_orphan_gc = true
first_cold_point_request_budget_after_orphan_gc = true
first_cold_point_byte_budget_after_orphan_gc = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
