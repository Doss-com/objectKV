schema_version = 1
id = "cell-online-resolver-map-split-v0"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0006-logical-range-model.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0048-partitioned-resolver-agreement.md",
  "../../rfcs/0049-stateless-resolver-generation-recovery.md",
  "../../rfcs/0050-stateless-resolver-authenticated-tlog-recovery.md",
  "../../rfcs/0051-multi-commit-proxy-global-ordering.md",
  "../../rfcs/0052-online-resolver-map-split.md",
]
dataset_generator = "deterministic-cell-online-resolver-map-split-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 98304
key_count = 256
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 1536
repeats = 1
backend = "sequencer-openraft+commit-proxy-processes+shadow-resolvers+authenticated-tagged-tlogs"
sequencer_nodes = 3
sequencer_quorum = 2
commit_proxy_processes = 3
source_resolver_processes = 3
shadow_resolver_processes = 2
source_map_epoch = 1
destination_map_epoch = 2
split_boundary = "78"
tagged_log_sets = 2
tagged_log_nodes_per_set = 3
tagged_log_write_quorum = 2
batches_per_seed = 30
transactions_per_batch = 4
snapshot_frontier_batch = 8
shadow_catchup_frontier_batch = 15
cutover_batch = 16
maximum_pending_batches = 8
maximum_conflict_history_entries = 256

[[lanes]]
id = "cell-online-resolver-map-split"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "cell-splits-hot-resolver-range-online"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"

[[workloads]]
id = "cell-cuts-over-before-shadow-catchup"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "cutover_before_shadow_catchup"

[[workloads]]
id = "cell-omits-source-conflict-history-entry"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "omit_source_history_entry"

[[workloads]]
id = "cell-combines-mixed-resolver-map-epochs-at-cutover"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "mix_map_epoch_replies"

[[workloads]]
id = "cell-counts-retired-source-resolver-reply"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "accept_retired_source_reply"

[[workloads]]
id = "cell-routes-crossing-range-to-one-split-child"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "route_to_one_split_child"

[[workloads]]
id = "cell-proxy-uses-stale-map-after-cutover"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "stale_proxy_map"

[[workloads]]
id = "cell-activates-map-before-cutover-tlog-quorum"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "activate_before_cutover_tlog_quorum"

[[workloads]]
id = "cell-changes-split-descriptor-after-catchup"
lane = "cell-online-resolver-map-split"
operation = "cell_online_resolver_map_split_contract"
negative_control = "mutate_split_descriptor"

[hard_gates]
correctness_anomalies = 0
sequencer_nodes = 3
sequencer_quorum = 2
commit_proxy_processes = 3
source_resolver_processes = 3
shadow_resolver_processes = 2
source_map_epoch = 1
destination_map_epoch = 2
batches_per_seed = 30
transactions_per_batch = 4
maximum_pending_batches = 8
split_descriptor_is_immutable = true
split_descriptor_binds_both_map_digests = true
source_history_snapshot_is_exact = true
source_entries_partition_exactly_across_children = true
shadow_children_start_empty = true
shadow_children_do_not_decide_before_cutover = true
touching_catchup_batches_reach_source_and_children = true
source_and_children_share_cutover_frontier = true
no_unresolved_old_map_transaction_crosses_cutover = true
all_proxies_apply_cutover_in_global_order = true
every_tlog_set_durably_records_cutover = true
new_map_waits_for_cutover_tlog_quorum = true
every_transaction_uses_one_map_epoch = true
crossing_ranges_route_to_every_child_overlap = true
retired_source_requests_rejected = true
retired_source_replies_rejected = true
abandoned_old_map_work_retries_with_new_identity = true
centralized_dispositions_exact = true
exact_rows = true
exact_visible_envelope_bytes = true
commit_envelope_chain_valid = true
exact_acknowledgement_set = true
all_proxy_map_views_exact = true
all_resolver_conflict_roots_exact = true
all_tlog_progress_roots_exact = true
durable_database_bytes_copied = 0
resolver_durable_syncs = 0
resolver_finalization_rpcs = 0
exact_canonical_replay = true
negative_control_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.profile.hash",
  "okv.eval.candidate.commit",
  "okv.eval.backend",
]
