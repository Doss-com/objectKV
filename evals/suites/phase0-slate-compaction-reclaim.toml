schema_version = 1
id = "phase0-slate-compaction-reclaim-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0003-immutable-segment-contract.md",
  "../../rfcs/0024-slatedb-bounded-configuration-pass.md",
  "../../rfcs/0025-slatedb-separate-compaction-contract.md",
  "../../rfcs/0026-slatedb-worker-process-reclaim.md",
  "../../docs/research/slatedb-seams-e016197.md",
]
dataset_generator = "deterministic-slate-compaction-reclaim-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-reclaim-8mib]
logical_bytes = 8388608
key_count = 8192
seeds = [1103]

[dataset.confirm-reclaim-8mib]
logical_bytes = 8388608
key_count = 8192
seeds = [2207, 3301]

[profiles.local-reclaim-8mib]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
backend = "slatedb-local-fs-process"
slatedb_revision = "e0161973d8d7ffdede7c44725729838811674e99"
overwrite_rounds = 8
claim_timeout_millis = 10000
reclaim_timeout_millis = 10000
completion_timeout_millis = 60000

[profiles.confirm-reclaim-8mib]
budget_kind = "seconds"
budget_limit = 360
repeats = 1
backend = "slatedb-local-fs-process"
slatedb_revision = "e0161973d8d7ffdede7c44725729838811674e99"
overwrite_rounds = 8
claim_timeout_millis = 10000
reclaim_timeout_millis = 10000
completion_timeout_millis = 60000

[[lanes]]
id = "slatedb-compaction-reclaim"
primary_metric = "compaction.reclaim_duration"
statistic = "median"
direction = "lower"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "slatedb-compaction-reclaim"
lane = "slatedb-compaction-reclaim"
operation = "slatedb_phase0_compaction_reclaim_contract"

[[workloads]]
id = "slatedb-compaction-reclaim-missing-replacement"
lane = "slatedb-compaction-reclaim"
operation = "slatedb_phase0_compaction_reclaim_contract"
negative_control = "skip_replacement_worker"

[hard_gates]
correctness_anomalies = 0
overwrite_l0_rounds_materialized = true
first_worker_claimed_running_job = true
first_worker_process_killed = true
stale_worker_claim_reclaimed = true
replacement_worker_identity_fresh = true
replacement_worker_completed_compaction = true
exact_latest_overwrite_after_reclaim = true
metadata_bounded_reopen_after_worker_reclaim = true
first_cold_point_request_budget_after_worker_reclaim = true
first_cold_point_byte_budget_after_worker_reclaim = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
