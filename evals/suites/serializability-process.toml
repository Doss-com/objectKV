schema_version = 1
id = "strict-serializability-process-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../schema/transaction-history-v1.schema.json",
]
dataset_generator = "deterministic-three-process-transaction-history-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-fs]
logical_bytes = 0
key_count = 5
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "events"
budget_limit = 30
repeats = 1
backend = "process-openraft+transaction-authority"
nodes = 3
process_starts_per_seed = 4
consensus_library = "openraft-0.9.25"
transport = "tokio-tcp"
state_machine_recovery = "retained-log-replay"

[[lanes]]
id = "replicated-strict-serializability"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "openraft-transaction-serializability"
lane = "replicated-strict-serializability"
operation = "transaction_process_serializability_contract"

[[workloads]]
id = "openraft-transaction-accept-conflicts"
lane = "replicated-strict-serializability"
operation = "transaction_process_serializability_contract"
negative_control = "accept_conflicts"

[[workloads]]
id = "openraft-transaction-partial-apply"
lane = "replicated-strict-serializability"
operation = "transaction_process_serializability_contract"
negative_control = "partial_apply"

[hard_gates]
correctness_anomalies = 0
point_and_range_conflicts_rejected = true
multi_range_commit_atomic = true
lost_reply_occurs_after_apply = true
successor_recovers_durable_outcome = true
exact_retry_returns_original_outcome = true
killed_node_replays_transaction_state = true
all_nodes_reconstruct_equal_state = true
fresh_process_replay_is_byte_exact = true
negative_controls_detected = true
schema_valid = true
budget_must_hold = true
