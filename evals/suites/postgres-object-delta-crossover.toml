schema_version = 1
id = "postgres-object-delta-crossover-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0064-incremental-object-delta-segments.md",
  "../../rfcs/0063-postgres-wal-before-page-write.md",
]
dataset_generator = "postgres-certified-object-delta-relation-size-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 536870912
key_count = 65536
seeds = [724841, 724842, 724843, 724844, 724845]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 7200
repeats = 1
backend = "postgres-certified-object-delta-local-filesystem"
changed_blocks = 1
required_txlog_sets = 2
txlog_nodes_per_set = 3
txlog_quorum_per_set = 2
maximum_segments_per_checkpoint_capture = 1
incremental_objectification = true
full_base_reference_isolated = true
full_base_rewrite_allowed_in_candidate_root = false

[[lanes]]
id = "postgres-object-delta-crossover"
primary_metric = "postgres.delta_to_full_rewrite_duration_ratio"
statistic = "median"
direction = "lower"
practical_improvement_fraction = 0.10

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "postgres-object-delta-crossover-2-pages"
lane = "postgres-object-delta-crossover"
operation = "postgres_incremental_object_delta_contract"
relation_blocks = 2
reference_full_base_rewrite = true

[[workloads]]
id = "postgres-object-delta-crossover-128-pages"
lane = "postgres-object-delta-crossover"
operation = "postgres_incremental_object_delta_contract"
relation_blocks = 128
reference_full_base_rewrite = true

[[workloads]]
id = "postgres-object-delta-crossover-4096-pages"
lane = "postgres-object-delta-crossover"
operation = "postgres_incremental_object_delta_contract"
relation_blocks = 4096
reference_full_base_rewrite = true

[[workloads]]
id = "postgres-object-delta-crossover-65536-pages"
lane = "postgres-object-delta-crossover"
operation = "postgres_incremental_object_delta_contract"
relation_blocks = 65536
reference_full_base_rewrite = true

[[workloads]]
id = "postgres-object-delta-crossover-full-base-in-candidate-root"
lane = "postgres-object-delta-crossover"
operation = "postgres_incremental_object_delta_contract"
relation_blocks = 128
negative_control = "write_replacement_full_base_sst"

[hard_gates]
correctness_anomalies = 0
relation_size_points_must_equal = [2, 128, 4096, 65536]
changed_block_must_equal = 1
changed_page_bytes_must_equal = 8192
delta_suffix_must_be_identical_within_seed = true
reference_full_base_must_use_isolated_root = true
candidate_root_must_write_zero_replacement_ssts = true
restart_rows_must_match_pre_restart_rows = true
exact_replay_must_hold = true
full_base_in_candidate_root_control_must_discard = true
schema_valid = true
budget_must_hold = true

[calibration_targets]
delta_bytes_max_to_min_ratio = 1.05
crossover_by_relation_pages = 4096
delta_to_full_rewrite_bytes_ratio_at_4096_pages = 0.01
delta_to_full_rewrite_bytes_ratio_at_65536_pages = 0.001

[telemetry.schema]
version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 1000
banned_attributes = [
  "key",
  "value",
  "version",
  "page.lsn",
  "wal.flush.lsn",
  "request.id",
]
