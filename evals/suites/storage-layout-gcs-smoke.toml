schema_version = 1
id = "storage-layout-gcs-smoke-v1"
status = "code_complete"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0002-version-and-mvcc-model.md",
  "../../rfcs/0003-immutable-segment-contract.md",
  "../../rfcs/0037-manifested-multi-layout-lsm.md",
  "../schema/benchmark-machine-receipt-v1.schema.json",
]
dataset_generator = "typed-mvcc-storage-layout-history-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["objectkv-dev-gcs-smoke"]

[dataset.objectkv-dev-gcs-smoke]
logical_bytes = 262144
key_count = 512
seeds = [5701]

[profiles.objectkv-dev-gcs-smoke]
budget_kind = "seconds"
budget_limit = 120
repeats = 1
backend = "gcs+observed-range-reads"
cache_state = "prepared-metadata-and-indexes+remote-gcs-data-gets"
key_count = 512
canonical_live_row_bytes = 512
opaque_payload_bytes = 480
base_version = 1
delta_cycles = 4
update_fraction = 0.125
delete_fraction = 0.01
point_operations = 64
target_run_object_bytes = 262144
row_block_bytes = 16384
columnar_block_rows = 128
build_profile = "release"
machine_receipt_env = "OKV_EVAL_MACHINE_RECEIPT"
machine_receipt_schema = "../schema/benchmark-machine-receipt-v1.schema.json"

# Smoke thresholds prove that candidate and control can complete against the
# same durable backend. They are intentionally not performance-admission bars.
admission_point_request_ratio_max = 1000.0
admission_point_bytes_ratio_max = 1000.0
admission_point_p99_ratio_max = 1000.0
admission_scan_throughput_ratio_min = 0.000001
admission_storage_amplification_ratio_max = 1000.0
admission_compaction_write_amplification_ratio_max = 1000.0
admission_resident_index_ratio_max = 1000.0

[[lanes]]
id = "layout-gcs-smoke"
primary_metric = "operation.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "split-projection-sidecar-vs-indexed-row-smoke"
lane = "layout-gcs-smoke"
operation = "storage_layout_diagnostic"
subject = "split_projection_sidecar_candidate"
baseline_subject = "indexed_row_object_control"

[hard_gates]
correctness_anomalies = 0
same_canonical_history_digest = true
exact_point_reads_at_requested_versions = true
exact_ordered_scans_and_tombstones = true
exact_post_compaction_digest = true
one_active_manifest_has_complete_closure = true
no_list_dependency = true
fetched_ranges_are_checksum_covered = true
complete_media_accounting = true
point_read_never_scans_complete_object = true
branch_reuses_unchanged_runs = true
candidate_and_baseline_alternate_by_seed_and_repeat = true
schema_valid = true
budget_must_hold = true
