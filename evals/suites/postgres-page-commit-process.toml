schema_version = 1
id = "postgres-page-commit-process-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0063-postgres-wal-before-page-write.md",
  "../../docs/research/postgres-18-6-storage-bridge.md",
]
dataset_generator = "postgres-page-extent-transaction-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 49152
key_count = 9
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "operations"
budget_limit = 24
repeats = 1
backend = "local-process+cell-v0+postgres-page-extent"
cell_processes_per_seed = 4
leader_handoffs_per_seed = 1
page_size_bytes = 8192
pages_per_transaction = 2
extent_mutations_per_transaction = 1
postgres_wal_flush_lsn = 900

[[lanes]]
id = "postgres-page-commit"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "postgres-page-commit-correct"
lane = "postgres-page-commit"
operation = "postgres_page_commit_process_contract"

[[workloads]]
id = "postgres-page-commit-omit-extent"
lane = "postgres-page-commit"
operation = "postgres_page_commit_process_contract"
negative_control = "omit_extent_mutation"

[[workloads]]
id = "postgres-page-commit-change-retry-identity"
lane = "postgres-page-commit"
operation = "postgres_page_commit_process_contract"
negative_control = "change_retry_identity"

[[workloads]]
id = "postgres-page-commit-wrong-receipt-identity"
lane = "postgres-page-commit"
operation = "postgres_page_commit_process_contract"
negative_control = "wrong_receipt_identity"

[[workloads]]
id = "postgres-page-commit-non-advancing-version"
lane = "postgres-page-commit"
operation = "postgres_page_commit_process_contract"
negative_control = "non_advancing_commit_version"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
cell_processes_per_seed = 4
leader_handoffs_per_seed = 1
page_size_bytes = 8192
pages_per_transaction = 2
extent_mutations_per_transaction = 1
page_and_extent_atomic = true
retry_identity_exact = true
commit_version_must_advance = true
successor_state_must_match = true
exact_canonical_replay = true
negative_controls_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true

[telemetry.schema]
version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "page.lsn",
  "wal.flush.lsn",
  "request.id",
  "mutation.sha256",
  "envelope.sha256",
  "trace.id",
  "span.id",
]
