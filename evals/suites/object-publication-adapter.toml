schema_version = 1
id = "object-publication-adapter-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0003-immutable-segment-contract.md",
  "../../rfcs/0004-object-store-correctness.md",
  "../../rfcs/0007-manifest-publication.md",
  "../../rfcs/0014-real-object-publication-adapter.md",
]
dataset_generator = "deterministic-physical-publication-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local]
logical_bytes = 16384
key_count = 16
seeds = [1103, 2207, 3301]

[profiles.local-fs]
budget_kind = "events"
budget_limit = 48
repeats = 1
backend = "object-store-local-fs+authority-quorum-fs"

[[lanes]]
id = "publication-adapter-correctness"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "object-publication-real-adapter"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"

[[workloads]]
id = "object-publication-adapter-root-before-verify"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "publish_root_before_verify"

[[workloads]]
id = "object-publication-adapter-omit-intent"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "omit_durable_intent"

[[workloads]]
id = "object-publication-adapter-forget-object-outcome"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "forget_unknown_object_outcome"

[[workloads]]
id = "object-publication-adapter-ram-authority"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "ram_only_authority"

[[workloads]]
id = "object-publication-adapter-trust-list"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "trust_list_for_liveness"

[[workloads]]
id = "object-publication-adapter-skip-revalidation"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "delete_without_revalidation"

[[workloads]]
id = "object-publication-adapter-skip-reservation"
lane = "publication-adapter-correctness"
operation = "object_publication_adapter_contract"
negative_control = "delete_without_reservation"

[hard_gates]
correctness_anomalies = 0
durable_intent_precedes_upload = true
verified_closure_precedes_root = true
unknown_outcomes_resolve_by_identity = true
authority_reopens_exact_state = true
incomplete_mark_reclaims_nothing = true
delete_plan_is_revalidated = true
delete_reservation_serializes_publication = true
post_delete_publication_reverifies_bytes = true
list_and_counters_are_non_authoritative = true
schema_valid = true
budget_must_hold = true
