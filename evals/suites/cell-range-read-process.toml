schema_version = 1
id = "cell-range-read-process-v0"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0058-kv-runtime-exact-version-read.md",
  "../../rfcs/0062-kv-runtime-routed-read-service.md",
]
dataset_generator = "deterministic-routed-authority-view-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 4096
key_count = 9
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "operations"
budget_limit = 240
repeats = 1
backend = "local-process+kv-runtime-routed-read+authority-bound-view"
worker_processes_per_seed = 1
ranges_per_worker = 2
point_reads_per_seed = 64
scan_reads_per_seed = 16
target_version = 9
transport = "tcp-json-v1"
cache_state = "process-warm"

[[lanes]]
id = "range-read-process"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "range-read-process-correct"
lane = "range-read-process"
operation = "range_read_process_contract"

[[workloads]]
id = "range-read-process-accept-stale-route"
lane = "range-read-process"
operation = "range_read_process_contract"
negative_control = "accept_stale_route"

[[workloads]]
id = "range-read-process-accept-crossing-scan"
lane = "range-read-process"
operation = "range_read_process_contract"
negative_control = "accept_crossing_scan"

[[workloads]]
id = "range-read-process-accept-wrong-value"
lane = "range-read-process"
operation = "range_read_process_contract"
negative_control = "accept_wrong_value"

[[workloads]]
id = "range-read-process-skip-worker-kill"
lane = "range-read-process"
operation = "range_read_process_contract"
negative_control = "skip_worker_kill"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
worker_processes_per_seed = 1
worker_kills_per_seed = 1
ranges_per_worker = 2
point_reads_per_seed = 64
scan_reads_per_seed = 16
wrong_values = 0
stale_route_must_refuse = true
crossing_scan_must_refuse = true
unavailable_snapshot_must_refuse = true
killed_worker_must_refuse = true
exact_canonical_replay = true
negative_controls_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
schema_version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
