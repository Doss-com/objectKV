schema_version = 1
id = "cell-range-serving-handoff-v1"
status = "active-work"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0007-manifest-publication.md",
  "../../rfcs/0038-range-tagged-transaction-log.md",
  "../../rfcs/0059-kv-runtime-snapshot-floor-and-history-gc.md",
  "../../rfcs/0060-replicated-snapshot-lease-authority.md",
  "../../rfcs/0061-range-serving-performance-curve.md",
]
dataset_generator = "deterministic-authority-base-certified-tail-handoff-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 4096
key_count = 2
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "events"
budget_limit = 63
repeats = 1
backend = "local-process+slatedb-object-base+openraft-publication+signed-txlog-quorums"
transaction_processes = 7
publication_authority_nodes = 3
signed_txlog_sets = 2
signed_txlog_nodes_per_set = 3
signed_txlog_quorum = 2
disposable_range_engine_workers = 5
base_frontiers = [3, 5]
target_version = 10

[[lanes]]
id = "range-serving-handoff"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "range-serving-handoff-correct"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"

[[workloads]]
id = "range-serving-handoff-publish-replacement-early"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "publish_replacement_before_old_worker"

[[workloads]]
id = "range-serving-handoff-omit-intermediate-tail"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "omit_intermediate_tail"

[[workloads]]
id = "range-serving-handoff-tamper-certificate"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "tamper_certificate"

[[workloads]]
id = "range-serving-handoff-stale-policy-epoch"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "stale_policy_epoch"

[[workloads]]
id = "range-serving-handoff-wrong-prior-root"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "wrong_expected_prior_root"

[[workloads]]
id = "range-serving-handoff-skip-authority-failover"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "skip_authority_failover"

[[workloads]]
id = "range-serving-handoff-ignore-pinned-old-root"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "ignore_pinned_old_root"

[[workloads]]
id = "range-serving-handoff-reuse-stale-mark-epoch"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "reuse_stale_mark_epoch"

[[workloads]]
id = "range-serving-handoff-retire-before-delete"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "retire_permit_before_delete"

[[workloads]]
id = "range-serving-handoff-reuse-stale-authority-snapshot"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "reuse_stale_authority_snapshot"

[[workloads]]
id = "range-serving-handoff-fallback-stale-authority-unavailable"
lane = "range-serving-handoff"
operation = "range_serving_handoff_contract"
negative_control = "fallback_to_stale_authority_when_unavailable"

[hard_gates]
correctness_anomalies = 0
minimum_seeds = 3
transaction_processes_per_seed = 7
publication_authority_nodes = 3
signed_txlog_sets = 2
signed_txlog_nodes_per_set = 3
signed_txlog_quorum = 2
disposable_workers_per_seed = 5
authority_failovers_per_seed = 1
txlog_process_kills_per_seed = 2
base_m0_frontier = 3
base_m1_frontier = 5
target_version = 10
authority_root_resolved_exactly = true
physical_closure_verified = true
signed_txlog_quorum_reconstructed = true
sparse_commit_chain_verified = true
m0_and_m1_match_transaction_oracle = true
replacement_compare_and_swap_enforced = true
old_root_snapshot_lease_pinned = true
pinned_root_delete_rejected = true
released_old_root_reclaimed = true
replacement_survives_reclamation = true
released_old_root_cache_reopen_rejected = true
stale_authority_snapshot_must_discard = true
authority_unavailable_must_fail_closed = true
stale_authority_fallback_must_discard = true
exact_canonical_replay = true
negative_controls_must_discard = true
telemetry_drops = 0
schema_valid = true
budget_must_hold = true
schema_version = 1
namespace = "okv.eval"

[cardinality]
max_series_per_run = 5000
banned_attributes = [
  "key",
  "value",
  "version",
  "request.id",
  "object.path",
  "trace.id",
  "span.id",
]
required_resource_attributes = [
  "service.name",
  "service.version",
  "deployment.environment.name",
  "okv.eval.run.id",
  "okv.eval.suite.id",
  "okv.eval.suite.hash",
  "okv.eval.profile.id",
  "okv.eval.profile.hash",
  "okv.eval.candidate.commit",
  "okv.eval.backend",
]
