schema_version = 1
id = "transaction-batch-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0008-transaction-isolation.md",
  "../../rfcs/0029-split-transaction-authority-frontiers.md",
  "../../rfcs/0032-transaction-batch-entry.md",
]
dataset_generator = "fixed-live-key-transaction-batch-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 32768
key_count = 256
seeds = [4901, 4902, 4903]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 120
repeats = 1
backend = "data-openraft-local-process+stable-journal"
authority_nodes = 3
transaction_count = 512
value_bytes = 128
candidate_transactions_per_batch = 16
control_max_in_flight = 32
candidate_min_transactions_per_second = 400
candidate_min_logical_transactions_per_append = 8
candidate_max_commit_p99_seconds = 0.1
paired_min_throughput_improvement = 2.5
build_profile = "release"
durability_profile = "openraft-node-journal-sync-all"

[[lanes]]
id = "transaction-batch"
primary_metric = "commit.throughput"
statistic = "median"
direction = "higher"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "transaction-batch-candidate"
lane = "transaction-batch"
operation = "transaction_batch_contract"
subject = "candidate"
window_class = "batch-entry"

[[workloads]]
id = "one-entry-same-durability-control"
lane = "transaction-batch"
operation = "transaction_batch_contract"
subject = "single_entry_control"
window_class = "one-entry"

[[workloads]]
id = "duplicate-identity-control"
lane = "transaction-batch"
operation = "transaction_batch_contract"
negative_control = "duplicate_identity_control"
window_class = "invalid-batch"

[[workloads]]
id = "early-ack-batch-poison"
lane = "transaction-batch"
operation = "transaction_batch_contract"
negative_control = "early_ack_poison"
window_class = "poison"

[hard_gates]
correctness_anomalies = 0
authority_processes = 3
transaction_count = 512
live_keys = 256
value_bytes = 128
release_build = true
unique_ordered_transaction_versionstamps = true
shared_batch_commit_version = true
exact_paginated_retained_stream = true
exact_final_values = true
exact_individual_and_batch_retry = true
in_batch_conflict_detected = true
duplicate_identity_rejected_before_mutation = true
leader_failover_preserves_state = true
killed_voter_restart_preserves_state = true
candidate_min_transactions_per_second = 400
candidate_min_logical_transactions_per_append = 8
candidate_max_commit_p99_seconds = 0.1
early_ack_poison_detected = true
fresh_controller_semantic_replay_is_exact = true
schema_valid = true
budget_must_hold = true
