schema_version = 1
id = "staged-txlog-v1"
status = "evaluating"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0024-ordered-log-substrate.md",
  "../../rfcs/0033-commit-proxy-batch-closure.md",
  "../../rfcs/0045-staged-quorum-txlog.md",
]
dataset_generator = "deterministic-staged-txlog-v1"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = ["gcp-r1-same-zone"]

[dataset.local-process]
logical_bytes = 16777216
key_count = 0
seeds = [1103, 2207, 3301]

[dataset.gcp-r1-same-zone]
logical_bytes = 1073741824
key_count = 0
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 180
repeats = 1
evidence_class = "contract"
log_nodes = 3
write_quorum = 2
client_processes = 1
record_bytes = [128, 1024, 4096]
segment_target_bytes = 16777216
max_inflight_appends = 4096
max_queue_entries = 8192
max_staging_bytes = 268435456
durability_profile = "quorum-nvme-local-process"

[profiles.gcp-r1-same-zone]
budget_kind = "seconds"
budget_limit = 1800
repeats = 5
evidence_class = "workload"
log_nodes = 3
write_quorum = 2
client_processes = 1
record_bytes = [128, 1024, 4096]
stream_count = 256
offered_loads_per_second = [10000, 25000, 50000, 100000, 200000]
segment_target_bytes = 16777216
max_inflight_appends = 4096
max_queue_entries = 8192
max_staging_bytes = 1073741824
max_local_tail_bytes = 34359738368
soft_publication_lag_millis = 2000
hard_publication_lag_millis = 10000
machine_class = "gcp-n2-standard-8"
failure_domain = "independent-vm-local-nvme-one-zone"

[profiles.gcp-r1-same-zone.workload_profile]
schema_version = 1
name = "staged-txlog-open-loop-v1"
dataset = "gcp-r1-same-zone"
access_pattern = "poisson-open-loop"
cache_state = "resident"
matched_control = "remote-block-single-writer"
operation_mix = { append = 1.0 }
concurrency = [64]
warmup = { kind = "seconds", amount = 30 }
measurement = { kind = "seconds", amount = 120 }
failure_schedule = ["none-during-measurement"]
resource_limits = { max_inflight_appends = 4096, max_queue_entries = 8192, max_staging_bytes = 1073741824, max_local_tail_bytes = 34359738368 }
required_metrics = [
  "log.append.ack_duration",
  "log.append.throughput",
  "log.append.hardware_floor_ratio",
  "log.queue.depth",
  "log.staging.bytes",
  "nvme.bytes",
  "network.bytes",
  "object_store.requests",
  "correctness.anomalies",
]

[[lanes]]
id = "staged-txlog-correctness"
primary_metric = "correctness.anomalies"
statistic = "total"
direction = "lower"
practical_improvement_fraction = 0.0

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes]]
id = "staged-txlog-append"
primary_metric = "log.append.ack_duration"
statistic = "p99"
direction = "lower"
practical_improvement_fraction = 0.25

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes.constraints]]
metric = "availability.success_ratio"
statistic = "minimum"
op = "eq"
value = 1.0

[[lanes.comparison_constraints]]
id = "p99-does-not-regress-vs-remote-block"
candidate_metric = "log.append.ack_duration"
control_metric = "log.append.ack_duration"
unit = "s"
direction = "lower"
max_regression_fraction = 0.0

[[lanes.comparison_constraints]]
id = "throughput-does-not-regress-vs-remote-block"
candidate_metric = "log.append.throughput"
control_metric = "log.append.throughput"
unit = "{append}/s"
direction = "higher"
max_regression_fraction = 0.0

[[lanes]]
id = "staged-txlog-publication"
primary_metric = "log.segment.publication_lag"
statistic = "p99"
direction = "lower"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes]]
id = "staged-txlog-failover"
primary_metric = "log.failover.duration"
statistic = "p99"
direction = "lower"
practical_improvement_fraction = 0.05

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[workloads]]
id = "staged-txlog-protocol-contract"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
subject = "protocol-model"

[[workloads]]
id = "staged-txlog-process-contract"
lane = "staged-txlog-correctness"
operation = "staged_txlog_process_contract"
subject = "three-process-quorum-nvme"

[[workloads]]
id = "staged-txlog-process-early-ack-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_process_contract"
negative_control = "ack_before_sync"

[[workloads]]
id = "staged-txlog-process-stale-writer-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_process_contract"
negative_control = "accept_stale_epoch"

[[workloads]]
id = "staged-txlog-process-segment-divergence-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_process_contract"
negative_control = "node_specific_segment_bytes"

[[workloads]]
id = "staged-txlog-quorum-nvme"
lane = "staged-txlog-append"
operation = "staged_txlog_contract"
subject = "quorum-nvme"
distribution = "poisson-open-loop"
concurrent_clients = 64

[[workloads]]
id = "staged-txlog-remote-block-control"
lane = "staged-txlog-append"
operation = "staged_txlog_contract"
subject = "remote-block-single-writer"
distribution = "poisson-open-loop"
concurrent_clients = 64

[[workloads]]
id = "staged-txlog-direct-object-control"
lane = "staged-txlog-append"
operation = "staged_txlog_contract"
subject = "sync-object"
distribution = "poisson-open-loop"
concurrent_clients = 64

[[workloads]]
id = "staged-txlog-segment-sweep"
lane = "staged-txlog-publication"
operation = "staged_txlog_contract"
subject = "segment-sweep"
segment_bytes = [262144, 1048576, 4194304, 16777216, 33554432]

[[workloads]]
id = "staged-txlog-node-loss"
lane = "staged-txlog-failover"
operation = "staged_txlog_contract"
subject = "kill-one-node"

[[workloads]]
id = "staged-txlog-writer-takeover"
lane = "staged-txlog-failover"
operation = "staged_txlog_contract"
subject = "writer-takeover"

[[workloads]]
id = "staged-txlog-ram-buffered"
lane = "staged-txlog-append"
operation = "staged_txlog_contract"
subject = "quorum-ram-buffered"
distribution = "poisson-open-loop"
concurrent_clients = 64

[[workloads]]
id = "staged-txlog-ack-one-copy-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "ack_one_copy"

[[workloads]]
id = "staged-txlog-stale-writer-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "accept_stale_epoch"

[[workloads]]
id = "staged-txlog-overwrite-acknowledged-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "overwrite_acknowledged_suffix"

[[workloads]]
id = "staged-txlog-publish-uncommitted-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "publish_uncommitted_segment"

[[workloads]]
id = "staged-txlog-list-authority-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "trust_object_list"

[[workloads]]
id = "staged-txlog-unbounded-queue-poison"
lane = "staged-txlog-correctness"
operation = "staged_txlog_contract"
negative_control = "unbounded_queue"

[hard_gates]
correctness_anomalies = 0
acknowledged_record_loss = 0
consecutive_recovery = true
stale_writer_rejected = true
unknown_outcome_retry_is_exact = true
uncommitted_segment_invisible = true
object_list_is_not_authority = true
queue_and_tail_bounds_hold = true
normal_append_object_requests = 0
l1_process_nodes = 3
l1_write_quorum = 2
l1_record_bytes = [128, 1024, 4096]
l1_exact_retry_has_no_physical_effect = true
l1_torn_tail_repaired_before_append = true
l1_stale_epoch_rejected_after_restart = true
l1_segment_bytes_identical = true
same_zone_128b_100k_p99_seconds = 0.001
same_zone_p50_hardware_floor_ratio = 1.5
paired_max_p99_ratio = 0.75
paired_min_throughput_ratio = 1.5
node_loss_max_p99_regression = 0.35
writer_recovery_max_seconds = 2.0
publication_p99_max_seconds = 5.0
object_puts_per_logical_gib_max = 128
ram_profile_reports_buffered_only = true
schema_valid = true
budget_must_hold = true
