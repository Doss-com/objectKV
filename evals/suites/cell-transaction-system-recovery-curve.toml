schema_version = 1
id = "cell-transaction-system-recovery-curve-v0"
status = "proposed"
metric_registry = "../metrics.toml"
result_schema = "../schema/result.schema.json"
contract_files = [
  "../../rfcs/0005-durability-and-wal.md",
  "../../rfcs/0009-failure-and-recovery-generations.md",
  "../../rfcs/0011-cell-and-tenant-topology.md",
  "../../rfcs/0040-authenticated-tagged-log-certificates.md",
  "../../rfcs/0053-commit-proxy-generation-recovery.md",
  "../../rfcs/0054-transaction-system-recovery-curve.md",
]
dataset_generator = "deterministic-transaction-system-recovery-curve-v0"

[telemetry]
protocol = "otlp-http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
required_signals = ["metrics", "traces", "logs"]
required_for_profiles = []

[dataset.local-process]
logical_bytes = 1
key_count = 1
seeds = [1103, 2207, 3301]

[profiles.local-process]
budget_kind = "seconds"
budget_limit = 300.0
repeats = 7
backend = "local-process+replicated-authority+authenticated-tlog-inventory"
sequencer_nodes = 3
sequencer_quorum = 2
tagged_log_write_quorum = 2
candidate_surface = "crates/okv-consensus/src/transaction_system_recovery_curve.rs"

[[lanes]]
id = "transaction-system-recovery-curve"
primary_metric = "recovery.transaction_system_duration"
statistic = "median"
direction = "lower"
practical_improvement_fraction = 0.10

[[lanes.constraints]]
metric = "correctness.anomalies"
statistic = "total"
op = "eq"
value = 0.0

[[lanes.constraints]]
metric = "recovery.database_bytes_read"
statistic = "total"
op = "eq"
value = 0.0

