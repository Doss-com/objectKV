name: okv-minio

services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OKV_MINIO_USER:-okvdev}
      MINIO_ROOT_PASSWORD: ${OKV_MINIO_PASSWORD:-okv-dev-only-secret}
    ports:
      - "127.0.0.1:${OKV_MINIO_API_PORT:-19110}:9000"
      - "127.0.0.1:${OKV_MINIO_CONSOLE_PORT:-19111}:9001"
    volumes:
      - type: bind
        source: ${OKV_MINIO_DATA_DIR:-/tmp/objectkv-minio-data}
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 1s
      timeout: 2s
      retries: 30

  initialize:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OKV_MINIO_USER:-okvdev}
      MINIO_ROOT_PASSWORD: ${OKV_MINIO_PASSWORD:-okv-dev-only-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing local/okv-dev
