services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OKV_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OKV_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OKV_OTEL_PROMETHEUS_PORT:-8889}:8889"
    read_only: true
    tmpfs:
      - /tmp
