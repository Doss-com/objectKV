SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2, n3}
    Txns = {t1}
    MaxVersion = 1
    MaxGeneration = 2
    Quorum = 2
    MaxMediaFailures = 1
    FaultAckBeforeStableQuorum = FALSE
    FaultSkipConflictValidation = FALSE
    FaultIgnoreGenerationFence = TRUE
    FaultPublishIncompleteClosure = FALSE
    FaultPopWithoutProtectedObject = FALSE
    FaultServeBehindCommit = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT OperationalConstraint
INVARIANT GenerationsAreFenced
