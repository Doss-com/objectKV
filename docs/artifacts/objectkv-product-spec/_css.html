<style>
:root {
  color-scheme: light;
  --ds-background-100: hsl(0, 0%, 100%);
  --ds-background-200: hsl(0, 0%, 98%);
  --ds-gray-100: hsl(0, 0%, 95%);
  --ds-gray-200: hsl(0, 0%, 92%);
  --ds-gray-300: hsl(0, 0%, 90%);
  --ds-gray-400: hsl(0, 0%, 92%);
  --ds-gray-500: hsl(0, 0%, 79%);
  --ds-gray-600: hsl(0, 0%, 46%);
  --ds-gray-700: hsl(0, 0%, 42%);
  --ds-gray-900: hsl(0, 0%, 30%);
  --ds-gray-1000: hsl(0, 0%, 9%);
  --ds-gray-alpha-100: #0000000a;
  --ds-gray-alpha-200: #0000000f;
  --ds-gray-alpha-300: #00000017;
  --ds-gray-alpha-400: #00000014;
  --ds-gray-alpha-500: #00000026;
  --ds-accent-700: hsl(212, 100%, 54%);
  --ds-accent-900: hsl(211, 100%, 42%);
  --ds-amber-700: hsl(39, 100%, 57%);
  --ds-amber-900: hsl(32, 92%, 36%);
  --ds-green-700: hsl(131, 41%, 46%);
  --ds-green-900: hsl(131, 51%, 34%);
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ds-background-100);
  color: var(--ds-gray-900);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
}

a { color: var(--ds-accent-900); text-decoration: none; }
a:hover { text-decoration: underline; }
main { max-width: 1360px; margin: 0 auto; padding: 48px 40px 64px; }

.hero { max-width: 980px; padding: 40px 0 48px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--ds-gray-600); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
h1 { margin: 20px 0 20px; max-width: 860px; color: var(--ds-gray-1000); font-size: clamp(36px, 5vw, 56px); font-weight: 600; line-height: 1.05; letter-spacing: -.035em; }
.hero-lede { margin: 0; max-width: 880px; color: var(--ds-gray-900); font-size: 18px; line-height: 1.6; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.badge { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 9px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 9999px; background: var(--ds-gray-alpha-200); color: var(--ds-gray-900); font-size: 11px; font-weight: 500; white-space: nowrap; }
.status-active { border-color: color-mix(in srgb, var(--ds-accent-700) 32%, transparent); background: color-mix(in srgb, var(--ds-accent-700) 8%, transparent); color: var(--ds-accent-900); }

.decision-strip { display: grid; grid-template-columns: minmax(220px, .8fr) minmax(320px, 1.4fr); gap: 40px; align-items: start; margin-bottom: 64px; padding: 24px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 6px; background: var(--ds-background-200); }
.decision-strip h2 { margin: 4px 0 0; }
.decision-strip p:last-child { margin: 0; font-size: 15px; color: var(--ds-gray-900); }
.eyebrow { margin: 0; color: var(--ds-gray-600); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }

.document-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 64px; align-items: start; }
.toc-panel { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; padding: 4px 0 24px; }
.toc { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.toc a { display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 6px 8px; border-radius: 4px; color: var(--ds-gray-900); font-size: 12px; line-height: 1.35; }
.toc a:hover { background: var(--ds-gray-alpha-100); color: var(--ds-gray-1000); text-decoration: none; }
.toc .num { color: var(--ds-gray-600); font-variant-numeric: tabular-nums; }

.content { min-width: 0; max-width: 940px; }
.content > h2 { margin: 72px 0 20px; padding-top: 8px; color: var(--ds-gray-1000); font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
.content > h2:first-child { margin-top: 0; }
.content h3 { margin: 44px 0 16px; color: var(--ds-gray-1000); font-size: 19px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.section-anchor { display: inline-block; min-width: 38px; margin-right: 8px; color: var(--ds-gray-600); font-family: var(--mono); font-size: 13px; font-weight: 400; letter-spacing: 0; vertical-align: 3px; }
.content p { margin: 0 0 16px; }
.content ul, .content ol { margin: 0 0 20px; padding-left: 22px; }
.content li { margin: 6px 0; }
.content strong { color: var(--ds-gray-1000); font-weight: 600; }

code { border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-gray-100); padding: 2px 5px; color: var(--ds-gray-1000); font-family: var(--mono); font-size: 12.5px; }
pre { overflow: auto; margin: 20px 0; border: 1px solid var(--ds-gray-alpha-400); border-radius: 6px; background: var(--ds-background-200); padding: 16px; }
pre > code { display: block; border: 0; background: transparent; padding: 0; line-height: 1.55; }

.table-shell { overflow-x: auto; margin: 20px 0 28px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; background: var(--ds-background-100); }
th { padding: 9px 12px; border-bottom: 1px solid var(--ds-gray-alpha-400); background: var(--ds-background-200); color: var(--ds-gray-900); font-size: 12px; font-weight: 500; line-height: 1.35; text-align: left; vertical-align: bottom; }
td { padding: 11px 12px; border-bottom: 1px solid var(--ds-gray-alpha-400); color: var(--ds-gray-900); font-size: 13px; line-height: 1.5; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--ds-gray-alpha-100); }

.audit-status { display: inline-flex; align-items: center; min-height: 20px; padding: 1px 7px; border-radius: 9999px; font-size: 10px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.audit-unaudited { border: 1px solid color-mix(in srgb, var(--ds-amber-700) 34%, transparent); background: color-mix(in srgb, var(--ds-amber-700) 9%, transparent); color: var(--ds-amber-900); }
.audit-audited { border: 1px solid color-mix(in srgb, var(--ds-green-700) 32%, transparent); background: color-mix(in srgb, var(--ds-green-700) 8%, transparent); color: var(--ds-green-900); }
.state-token { display: inline-flex; align-items: center; min-height: 20px; margin: 0 2px; padding: 1px 6px; border-radius: 9999px; background: var(--ds-gray-alpha-200); color: var(--ds-gray-900); font-size: 10px; font-weight: 500; letter-spacing: .03em; white-space: nowrap; }
.state-proposed { border: 1px solid color-mix(in srgb, var(--ds-amber-700) 30%, transparent); background: color-mix(in srgb, var(--ds-amber-700) 7%, transparent); color: var(--ds-amber-900); }
.state-verified { border: 1px solid color-mix(in srgb, var(--ds-green-700) 28%, transparent); background: color-mix(in srgb, var(--ds-green-700) 7%, transparent); color: var(--ds-green-900); }
.state-code-complete { border: 1px solid color-mix(in srgb, var(--ds-accent-700) 28%, transparent); background: color-mix(in srgb, var(--ds-accent-700) 7%, transparent); color: var(--ds-accent-900); }
.state-evaluating { border: 1px solid color-mix(in srgb, var(--ds-amber-700) 30%, transparent); background: color-mix(in srgb, var(--ds-amber-700) 7%, transparent); color: var(--ds-amber-900); }

.architecture-diagram { margin: 24px 0 32px; padding: 24px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 6px; background: var(--ds-background-200); }
.flow-stack { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.flow-node { padding: 12px 16px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-background-100); color: var(--ds-gray-1000); font-size: 13px; font-weight: 500; text-align: center; }
.flow-node small { display: block; margin-top: 2px; color: var(--ds-gray-600); font-size: 11px; font-weight: 400; }
.flow-arrow { color: var(--ds-gray-600); font-size: 18px; line-height: 1; text-align: center; }
.node-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.node-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.flow-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: flow-step; }
.flow-steps li { min-height: 112px; margin: 0; padding: 12px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-background-100); color: var(--ds-gray-900); font-size: 12px; line-height: 1.45; counter-increment: flow-step; }
.flow-steps li::before { content: counter(flow-step, decimal-leading-zero); display: block; margin-bottom: 10px; color: var(--ds-accent-900); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tier-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tier { padding: 14px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-background-100); }
.tier .tier-num { color: var(--ds-accent-900); font-size: 11px; font-weight: 500; }
.tier h4 { margin: 6px 0 4px; color: var(--ds-gray-1000); font-size: 13px; font-weight: 600; }
.tier p { margin: 0; color: var(--ds-gray-600); font-size: 11.5px; line-height: 1.45; }
.diagram-caption { margin: 12px 0 0; color: var(--ds-gray-600); font-size: 12px; text-align: center; }

footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--ds-gray-alpha-400); color: var(--ds-gray-600); font-size: 11px; }

@media (max-width: 980px) {
  main { padding: 32px 24px 48px; }
  .document-grid { grid-template-columns: 1fr; gap: 40px; }
  .toc-panel { position: static; max-height: none; padding: 16px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 6px; }
  .toc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow-steps, .tier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 640px) {
  main { padding: 24px 16px 40px; }
  .hero { padding-top: 24px; }
  .decision-strip { grid-template-columns: 1fr; gap: 12px; }
  .toc, .node-grid, .node-grid.three, .flow-steps, .tier-grid { grid-template-columns: 1fr; }
  .content > h2 { font-size: 24px; }
  footer { flex-direction: column; }
}

@media print {
  *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  body { background: var(--ds-background-100) !important; color: var(--ds-gray-1000) !important; }
  main { max-width: none; padding: .5in; }
  .toc-panel { position: static; max-height: none; }
  .document-grid { grid-template-columns: 1fr; }
  .architecture-diagram, .table-shell, .decision-strip { break-inside: avoid; }
}
</style>
