<style>
:root {
  color-scheme: light;
  --ds-background-100: #ffffff;
  --ds-background-200: #fafafa;
  --ds-gray-100: #f2f2f2;
  --ds-gray-200: #ebebeb;
  --ds-gray-300: #e6e6e6;
  --ds-gray-500: #c9c9c9;
  --ds-gray-600: #757575;
  --ds-gray-900: #4d4d4d;
  --ds-gray-1000: #171717;
  --ds-gray-alpha-100: #0000000a;
  --ds-gray-alpha-200: #0000000f;
  --ds-gray-alpha-400: #00000014;
  --ds-blue-100: #eff6ff;
  --ds-blue-700: #1a85ff;
  --ds-blue-900: #0061d5;
  --ds-green-100: #ecfdf5;
  --ds-green-700: #45a557;
  --ds-green-900: #2f7c3d;
  --ds-amber-100: #fffbeb;
  --ds-amber-700: #f5a623;
  --ds-amber-900: #a15c00;
  --ds-red-100: #fef2f2;
  --ds-red-700: #e5484d;
  --ds-red-900: #cd2b31;
  --bg: var(--ds-background-100);
  --surface: var(--ds-background-200);
  --surface-2: var(--ds-gray-100);
  --border: var(--ds-gray-alpha-400);
  --border-strong: var(--ds-gray-500);
  --text: var(--ds-gray-900);
  --text-strong: var(--ds-gray-1000);
  --muted: var(--ds-gray-600);
  --blue: var(--ds-blue-900);
  --blue-bg: var(--ds-blue-100);
  --green: var(--ds-green-900);
  --green-bg: var(--ds-green-100);
  --amber: var(--ds-amber-900);
  --amber-bg: var(--ds-amber-100);
  --red: var(--ds-red-900);
  --red-bg: var(--ds-red-100);
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--sans); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: 12px/1.45 var(--mono); color: var(--text-strong); }
.muted { color: var(--muted); }

.shell { max-width: 1440px; margin: 0 auto; padding: 36px 40px 72px; }
.hero { max-width: 1060px; padding: 22px 0 34px; }
.kicker { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
h1 { max-width: 920px; margin: 18px 0 16px; color: var(--text-strong); font-size: clamp(38px, 5vw, 48px); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.lede { max-width: 940px; margin: 0; color: var(--text); font-size: 19px; line-height: 1.55; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.button { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--bg); color: var(--text-strong); font-size: 12px; font-weight: 600; }
.button.primary { border-color: var(--text-strong); background: var(--text-strong); color: var(--ds-background-100); }
.button:hover { text-decoration: none; background: var(--surface-2); }
.button.primary:hover { background: var(--ds-gray-900); }

.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 42px; }
.summary-card { min-height: 132px; padding: 18px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); }
.summary-card .value { display: block; margin: 8px 0 4px; color: var(--text-strong); font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.summary-card .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.summary-card p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

.layout { display: grid; grid-template-columns: 218px minmax(0, 1fr); gap: 62px; align-items: start; }
.side { position: sticky; top: 20px; }
.side-title { margin: 0 0 10px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc a { display: grid; grid-template-columns: 24px 1fr; gap: 6px; padding: 6px 8px; border-radius: 4px; color: var(--text); font-size: 12px; line-height: 1.35; }
.toc a span { color: var(--muted); font-family: var(--mono); }
.toc a:hover { background: var(--surface); color: var(--text-strong); text-decoration: none; }
.side-note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.5; }
.content { min-width: 0; max-width: 1060px; }
.content section { margin-bottom: 68px; scroll-margin-top: 24px; }
h2 { margin: 0 0 20px; color: var(--text-strong); font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
.section-id { display: inline-block; min-width: 48px; margin-right: 4px; color: var(--muted); font: 13px var(--mono); vertical-align: 4px; }
h3 { margin: 30px 0 12px; color: var(--text-strong); font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0 0 15px; }

.callout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 22px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); }
.callout .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.callout h3 { margin: 4px 0 0; font-size: 20px; }
.callout p { margin: 0; font-size: 15px; }

.status { display: inline-flex; align-items: center; min-height: 21px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.status.verified { border-color: var(--ds-green-700); background: var(--green-bg); color: var(--green); }
.status.complete { border-color: var(--ds-blue-700); background: var(--blue-bg); color: var(--blue); }
.status.evaluating { border-color: var(--ds-amber-700); background: var(--amber-bg); color: var(--amber); }
.status.proposed { border-color: var(--border-strong); background: var(--surface); color: var(--muted); }
.status.blocked { border-color: var(--ds-red-700); background: var(--red-bg); color: var(--red); }

.architecture { padding: 22px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); }
.arch-layer { display: grid; grid-template-columns: 140px 1fr; gap: 18px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
.arch-layer:last-child { border-bottom: 0; }
.arch-label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.arch-nodes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.arch-node { min-height: 58px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--bg); color: var(--text-strong); font-size: 12px; font-weight: 600; }
.arch-node small { display: block; margin-top: 2px; color: var(--muted); font-weight: 400; line-height: 1.35; }
.arch-arrow { margin: 4px 0 4px 159px; color: var(--muted); font-size: 17px; }
.equation { margin: 18px 0 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); font: 13px var(--mono); text-align: center; }

.text-map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.text-map { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); }
.text-map h3 { margin: 0 0 10px; font-size: 14px; }
.text-map pre { overflow-x: auto; margin: 0; color: var(--text); font: 11.5px/1.5 var(--mono); white-space: pre; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 5px; }
table { width: 100%; border-collapse: collapse; background: var(--bg); }
th { padding: 9px 11px; border-bottom: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .04em; text-align: left; text-transform: uppercase; vertical-align: bottom; }
td { padding: 11px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px; line-height: 1.45; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--ds-gray-alpha-100); }

.curve-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.curve { padding: 17px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); }
.curve-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.curve h3 { margin: 0; font-size: 15px; }
.curve dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; margin: 16px 0 0; font-size: 12px; }
.curve dt { color: var(--muted); }
.curve dd { margin: 0; color: var(--text); }
.curve .stop { color: var(--red); }

.ladder { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)); gap: 8px; align-items: end; overflow-x: auto; padding: 16px 0 4px; }
.rung { display: flex; flex-direction: column; min-width: 112px; padding: 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); }
.rung:nth-child(1) { height: 242px; }.rung:nth-child(2) { height: 218px; }.rung:nth-child(3) { height: 194px; }.rung:nth-child(4) { height: 170px; }.rung:nth-child(5) { height: 146px; }.rung:nth-child(6) { height: 122px; }.rung:nth-child(7) { height: 98px; }
.rung.verified { border-color: var(--ds-green-700); background: var(--green-bg); }
.rung.evaluating { border-color: var(--ds-amber-700); background: var(--amber-bg); }
.rung strong { color: var(--text-strong); font-size: 12px; line-height: 1.3; }
.rung p { margin: 6px 0 auto; color: var(--muted); font-size: 10px; line-height: 1.35; }
.rung .n { margin-bottom: 10px; color: var(--text-strong); font: 600 16px var(--sans); }
.rung .status { align-self: flex-start; margin-top: 8px; }

.log { border-left: 1px solid var(--border-strong); margin-left: 9px; }
.log-entry { position: relative; padding: 0 0 24px 24px; }
.log-entry::before { content: ""; position: absolute; left: -4px; top: 6px; width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; background: var(--bg); }
.log-entry:last-child { padding-bottom: 0; }
.log-entry time { display: block; color: var(--muted); font: 10px var(--mono); }
.log-entry h3 { margin: 3px 0 4px; font-size: 14px; }
.log-entry p { margin: 0; color: var(--muted); font-size: 12px; }

.foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }

@media (max-width: 1020px) {
  .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .layout { grid-template-columns: 1fr; gap: 36px; }
  .side { position: static; padding: 14px; border: 1px solid var(--border); border-radius: 5px; }
  .toc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .shell { padding: 24px 16px 48px; }
  .summary-grid, .curve-grid, .callout, .text-map-grid { grid-template-columns: 1fr; }
  .arch-layer { grid-template-columns: 1fr; }
  .arch-nodes { grid-template-columns: 1fr; }
  .arch-arrow { margin-left: 12px; }
  .toc { grid-template-columns: 1fr; }
  .foot { flex-direction: column; }
}
@media print {
  *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .shell { max-width: none; padding: .45in; }
  .layout { grid-template-columns: 1fr; }
  .side { position: static; break-after: page; }
  .button { display: none; }
  .summary-card, .callout, .architecture, .curve, .text-map, .table-wrap, .ladder { break-inside: avoid; }
  .content section { break-before: auto; }
}
</style>
