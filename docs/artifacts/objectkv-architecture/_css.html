<style>
:root {
  color-scheme: dark;
  --ds-background-100: hsl(0, 0%, 4%);
  --ds-background-200: hsl(0, 0%, 7%);
  --ds-gray-100: rgba(255, 255, 255, 0.03);
  --ds-gray-200: rgba(255, 255, 255, 0.05);
  --ds-gray-300: rgba(255, 255, 255, 0.08);
  --ds-gray-400: hsl(0, 0%, 18%);
  --ds-gray-500: hsl(0, 0%, 27%);
  --ds-gray-600: hsl(0, 0%, 53%);
  --ds-gray-900: hsl(0, 0%, 63%);
  --ds-gray-1000: hsl(0, 0%, 93%);
  --ds-gray-alpha-100: #ffffff0f;
  --ds-gray-alpha-200: #ffffff17;
  --ds-gray-alpha-400: #ffffff24;
  --ds-gray-alpha-500: #ffffff3d;
  --ds-accent-700: hsl(212, 100%, 54%);
  --ds-accent-900: hsl(210, 100%, 66%);
  --ds-green-700: hsl(131, 41%, 46%);
  --ds-green-900: hsl(131, 43%, 57%);
  --ds-amber-700: hsl(39, 100%, 57%);
  --ds-amber-900: hsl(39, 90%, 60%);
  --ds-red-700: hsl(358, 75%, 59%);
  --ds-red-900: hsl(358, 100%, 69%);
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ds-background-100); color: var(--ds-gray-900); font: 14px/1.6 var(--sans); }
a { color: var(--ds-accent-900); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: 12px/1.5 var(--mono); color: var(--ds-gray-1000); }
strong { color: var(--ds-gray-1000); font-weight: 600; }
.muted { color: var(--ds-gray-600); }

.shell { width: min(1540px, 100%); margin: 0 auto; padding: 40px 44px 72px; }
.hero { max-width: 1100px; padding: 18px 0 36px; }
.kicker { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--ds-gray-600); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
h1 { max-width: 980px; margin: 18px 0 16px; color: var(--ds-gray-1000); font-size: clamp(38px, 5vw, 48px); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.lede { max-width: 980px; margin: 0; color: var(--ds-gray-900); font-size: 19px; line-height: 1.55; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.button { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px; border: 1px solid var(--ds-gray-alpha-500); border-radius: 4px; background: transparent; color: var(--ds-gray-1000); font-size: 12px; font-weight: 600; }
.button:hover { background: var(--ds-gray-200); text-decoration: none; }
.button.primary { border-color: var(--ds-gray-1000); background: var(--ds-gray-1000); color: var(--ds-background-100); }

.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 48px; }
.summary-card { min-height: 138px; padding: 18px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; background: var(--ds-gray-100); }
.summary-card .label { color: var(--ds-gray-600); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.summary-card .value { display: block; margin: 8px 0 5px; color: var(--ds-gray-1000); font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.summary-card p { margin: 0; color: var(--ds-gray-600); font-size: 12px; line-height: 1.45; }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 64px; align-items: start; }
.side { position: sticky; top: 20px; }
.side-title { margin-bottom: 10px; color: var(--ds-gray-600); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc a { display: grid; grid-template-columns: 25px 1fr; gap: 6px; padding: 6px 8px; border-radius: 4px; color: var(--ds-gray-900); font-size: 12px; line-height: 1.35; }
.toc a span { color: var(--ds-gray-600); font-family: var(--mono); }
.toc a:hover { background: var(--ds-gray-100); color: var(--ds-gray-1000); text-decoration: none; }
.side-note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--ds-gray-alpha-400); color: var(--ds-gray-600); font-size: 11px; line-height: 1.5; }
.content { min-width: 0; max-width: 1180px; }
.content section { margin-bottom: 72px; scroll-margin-top: 24px; }
h2 { margin: 0 0 22px; color: var(--ds-gray-1000); font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
.section-id { display: inline-block; min-width: 50px; margin-right: 4px; color: var(--ds-gray-600); font: 13px var(--mono); vertical-align: 4px; }
h3 { margin: 30px 0 12px; color: var(--ds-gray-1000); font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0 0 15px; }

.callout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 22px; border: 1px solid var(--ds-gray-alpha-500); border-radius: 5px; background: var(--ds-gray-100); }
.callout .label { color: var(--ds-gray-600); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.callout h3 { margin: 4px 0 0; font-size: 20px; }
.callout p { margin: 0; color: var(--ds-gray-900); font-size: 15px; }

.status { display: inline-flex; align-items: center; min-height: 21px; padding: 2px 7px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 9999px; font-size: 10px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.status.verified { border-color: var(--ds-green-700); color: var(--ds-green-900); }
.status.complete { border-color: var(--ds-accent-700); color: var(--ds-accent-900); }
.status.evaluating { border-color: var(--ds-amber-700); color: var(--ds-amber-900); }
.status.proposed, .status.future { border-color: var(--ds-gray-alpha-500); color: var(--ds-gray-600); }
.status.no { border-color: var(--ds-red-700); color: var(--ds-red-900); }

.stack { padding: 20px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; background: var(--ds-background-200); }
.stack-layer { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--ds-gray-alpha-400); }
.stack-layer:last-child { border-bottom: 0; }
.stack-label { color: var(--ds-gray-600); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.stack-nodes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stack-node { min-height: 64px; padding: 10px 12px; border: 1px solid var(--ds-gray-alpha-500); border-radius: 4px; background: var(--ds-gray-100); color: var(--ds-gray-1000); font-size: 12px; font-weight: 600; }
.stack-node small { display: block; margin-top: 3px; color: var(--ds-gray-600); font-weight: 400; line-height: 1.35; }
.equation { margin-top: 16px; padding: 13px 16px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-gray-100); color: var(--ds-gray-1000); font: 13px/1.5 var(--mono); text-align: center; }

.diagram-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.diagram { min-width: 0; padding: 17px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; background: var(--ds-background-200); }
.diagram h3 { margin: 0 0 11px; font-size: 14px; }
.diagram pre { overflow-x: auto; margin: 0; color: var(--ds-gray-900); font: 11.5px/1.52 var(--mono); white-space: pre; }

.table-wrap { overflow-x: auto; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; }
table { width: 100%; border-collapse: collapse; background: var(--ds-background-100); }
th { padding: 9px 11px; border-bottom: 1px solid var(--ds-gray-alpha-500); background: var(--ds-gray-100); color: var(--ds-gray-600); font-size: 10px; font-weight: 600; letter-spacing: .04em; text-align: left; text-transform: uppercase; vertical-align: bottom; }
td { padding: 11px; border-bottom: 1px solid var(--ds-gray-alpha-400); color: var(--ds-gray-900); font-size: 12px; line-height: 1.48; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--ds-gray-alpha-100); }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { padding: 18px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; background: var(--ds-gray-100); }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.card h3 { margin: 0; font-size: 15px; }
.card dl { display: grid; grid-template-columns: 96px 1fr; gap: 7px 12px; margin: 16px 0 0; font-size: 12px; }
.card dt { color: var(--ds-gray-600); }
.card dd { margin: 0; color: var(--ds-gray-900); }

.ladder { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 8px; overflow-x: auto; align-items: stretch; }
.rung { min-width: 130px; padding: 14px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 4px; background: var(--ds-gray-100); }
.rung.current { border-color: var(--ds-green-700); }
.rung .n { color: var(--ds-gray-1000); font-size: 20px; font-weight: 600; }
.rung strong { display: block; margin: 6px 0; font-size: 12px; }
.rung p { margin: 0 0 10px; color: var(--ds-gray-600); font-size: 10.5px; line-height: 1.4; }

.foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--ds-gray-alpha-400); color: var(--ds-gray-600); font-size: 11px; }

@media (max-width: 1040px) {
  .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .layout { grid-template-columns: 1fr; gap: 36px; }
  .side { position: static; padding: 14px; border: 1px solid var(--ds-gray-alpha-400); border-radius: 5px; }
  .toc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .shell { padding: 24px 16px 48px; }
  .summary-grid, .diagram-grid, .cards, .callout { grid-template-columns: 1fr; }
  .stack-layer { grid-template-columns: 1fr; }
  .stack-nodes { grid-template-columns: 1fr; }
  .toc { grid-template-columns: 1fr; }
  .foot { flex-direction: column; }
}
@media print {
  *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .shell { max-width: none; padding: .45in; }
  .layout { grid-template-columns: 1fr; }
  .side { position: static; break-after: page; }
  .button { display: none; }
  .summary-card, .callout, .stack, .diagram, .card, .table-wrap, .ladder { break-inside: avoid; }
}
</style>
